name: Prediction Market R4 Validation Temp

on:
  push:
    branches:
      - feature/prediction-market-r9-player-trading-r4

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Accepted R2 tests
        run: node tests/prediction_market_engine_r2_tests.js
      - name: Accepted R3 tests
        run: node tests/prediction_market_admin_r3_tests.js
      - name: Prediction Market R4 tests
        run: node tests/prediction_market_player_r4_tests.js
      - name: Explicit diff check
        run: git diff --check f6713195e0e6354fd421cf5082bdf8b76c5b676b...HEAD
      - name: Full production checks
        run: bash tools/run_production_checks.sh

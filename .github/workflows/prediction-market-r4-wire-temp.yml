name: Prediction Market R4 Wire Temp

on:
  push:
    branches:
      - feature/prediction-market-r9-player-trading-r4

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire R4 player route and API
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text(); c=s.count(old)
              if c!=1: raise SystemExit(f'{path}: expected one marker, found {c}: {old!r}')
              p.write_text(s.replace(old,new,1))

          replace_once('backend/core/ApiSecurity.js',
              '  saveSurvivorPick: true, saveSportsSurvivorAutoPickPreference: true, saveSeasonAnchorPick: true, saveBet: true, removeBet: true,\n',
              '  saveSurvivorPick: true, saveSportsSurvivorAutoPickPreference: true, saveSeasonAnchorPick: true, saveBet: true, removeBet: true, executePredictionMarketTrade: true,\n')

          replace_once('backend/Api.js',
              '    if (action === "saveEditableProfile") {\n',
              '    if (action === "getPredictionMarketPlayerState" || action === "getPredictionMarketPlayerDetail" ||\n'
              '        action === "bootstrapPredictionMarketWallet" || action === "executePredictionMarketTrade" ||\n'
              '        action === "getPredictionMarketLeaderboard") {\n'
              '      return json(apiPredictionMarketPlayerR4Dispatch(action, body));\n'
              '    }\n\n'
              '    if (action === "saveEditableProfile") {\n')

          for path in ['frontend/js/api.js','frontend/api.js']:
              replace_once(path,
                  '/* ======================\n   TEAM FANTASY POST BRIDGE — v1.2.18j2\n',
                  'function apiPredictionMarketPlayerR4(action, payload = {}) {\n'
                  '  return api(action, payload || {});\n'
                  '}\n\n'
                  '/* ======================\n   TEAM FANTASY POST BRIDGE — v1.2.18j2\n')

          for path in ['frontend/js/app.js','frontend/app.js']:
              replace_once(path,
                  '  "betting": ["betting"],\n',
                  '  "betting": ["betting"],\n  "prediction-markets": ["predictionMarketsR4"],\n')
              replace_once(path,
                  '    page === "betting" ||\n',
                  '    page === "betting" ||\n    page === "prediction-markets" ||\n')
              replace_once(path,
                  '    "betting": "Wagers",\n',
                  '    "betting": "Wagers",\n    "prediction-markets": "Prediction Markets",\n')
              marker='    case "betting":\n'
              p=Path(path); s=p.read_text(); c=s.count(marker)
              if c!=1: raise SystemExit(f'{path}: betting case count {c}')
              s=s.replace(marker,
                  '    case "prediction-markets":\n'
                  '      if (typeof renderPredictionMarketsPage !== "function") throw new Error("Prediction Markets player script is not loaded.");\n'
                  '      app.innerHTML = await renderPredictionMarketsPage();\n'
                  '      break;\n\n'
                  + marker,1)
              p.write_text(s)

          replace_once('frontend/app.html',
              '  <button data-page="more" onclick="navigate(\'more\')">\n',
              '  <button data-page="prediction-markets" onclick="navigate(\'prediction-markets\')">\n'
              '    <span class="bottom-nav-icon">◐</span>\n'
              '    <span class="bottom-nav-label">Markets</span>\n'
              '  </button>\n\n'
              '  <button data-page="more" onclick="navigate(\'more\')">\n')
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/Api.js backend/core/ApiSecurity.js frontend/js/api.js frontend/api.js frontend/js/app.js frontend/app.js frontend/app.html
          git commit -m "Wire Prediction Market R4 player trading"
          git push origin HEAD:feature/prediction-market-r9-player-trading-r4

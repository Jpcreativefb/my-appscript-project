name: Prediction Market R6 Validation Temp

on:
  push:
    branches:
      - test/prediction-market-r9-release-validation-r6

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Correct R6 external provider clock fixture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/prediction_market_release_validation_r6_tests.js')
          s=p.read_text()
          old="""const extNow = { value: BASE_NOW };\nconst extRepo = predictionMarketR2CreateMemoryRepository();"""
          new="""const extNow = { value: Date.now() };\nconst extIso = offset => new Date(extNow.value + offset).toISOString();\nconst extRepo = predictionMarketR2CreateMemoryRepository();"""
          if old not in s: raise SystemExit('ext clock anchor missing')
          s=s.replace(old,new,1)
          s=s.replace("last_price_dollars:'0.65',updated_time:'2026-10-18T11:59:00Z'", "last_price_dollars:'0.65',updated_time:extIso(-60*1000)", 1)
          s=s.replace("referencePriceAsOf:'2026-10-18T11:58:00Z'", "referencePriceAsOf:extIso(-2*60*1000)", 1)
          s=s.replace("lockTime:'2026-10-18T13:00:00Z'", "lockTime:extIso(60*60*1000)", 1)
          s=s.replace("referencePriceAsOf:'2026-10-18T10:00:00Z'", "referencePriceAsOf:extIso(-60*60*1000)", 1)
          p.write_text(s)
          PY
          node tests/prediction_market_release_validation_r6_tests.js
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/prediction_market_release_validation_r6_tests.js
          git commit -m "Fix R6 external provider clock fixture"
          git push origin HEAD:test/prediction-market-r9-release-validation-r6
      - name: Accepted R2 tests
        run: node tests/prediction_market_engine_r2_tests.js
      - name: Accepted R3 tests
        run: node tests/prediction_market_admin_r3_tests.js
      - name: Accepted R4 tests
        run: node tests/prediction_market_player_r4_tests.js
      - name: Accepted R5 tests
        run: node tests/prediction_market_reference_providers_r5_tests.js
      - name: Prediction Market R6 tests
        run: node tests/prediction_market_release_validation_r6_tests.js
      - name: Explicit diff check
        run: git diff --check ae7fcb09addb619a22ec67a01e93a6f849a29591...HEAD
      - name: Full production checks
        run: bash tools/run_production_checks.sh

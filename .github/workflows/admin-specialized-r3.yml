name: Admin Specialized Manager R3

on:
  push:
    branches:
      - fix/admin-specialized-manager-pages-r3

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/admin-specialized-manager-pages-r3
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply R3 presentation ownership patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/admin-specialized-r3-patch.py')
          s = p.read_text()
          start = s.index('# Futures: expose its existing presentation card for the Cup page, stop Manage Games injection.')
          end = s.index('# Cup Control: expose existing layout as a dedicated renderer, stop injecting Manage Games.')
          replacement = '''# Futures: expose its existing presentation card for the Cup page, stop Manage Games injection.\nsection_start = games.index("/* PATTC NFL CUP + FUTURES R1")\nsection_end = games.index("/* PATTC NFL Cup Admin Control Center R1", section_start)\nsection = games[section_start:section_end]\nwrap_start = section.index("const BASE=root.renderAdminGamesPage;")\ncard_start = section.index("  const card='", wrap_start) + len("  const card='")\ncard_end = section.index("';\\n  const pos=html.indexOf", card_start)\ncard_literal = section[card_start:card_end]\nwrap_end = section.rindex("})(window);")\nsection = section[:wrap_start] + "root.nflCupFuturesAdminCardR3_=function(){return '" + card_literal + "';};\\n" + section[wrap_end:]\ngames = games[:section_start] + section + games[section_end:]\n\n'''
          p.write_text(s[:start] + replacement + s[end:])
          PY
          python3 .github/admin-specialized-r3-patch.py
          rm -f .github/admin-specialized-r3-patch.py .github/workflows/admin-specialized-r3.yml
      - name: Syntax checks
        run: |
          node --check frontend/js/pages/admin.js
          node --check frontend/js/pages/adminGamesRc24e.js
          node --check frontend/js/pages/adminSportsManagersR3.js
          node --check frontend/js/app.js
          node --check tests/admin_specialized_manager_pages_r3_tests.js
      - name: R3 focused contracts
        run: node tests/admin_specialized_manager_pages_r3_tests.js
      - name: Existing Admin R1 and R2 tests
        run: |
          set -e
          for test in tests/admin_*r1*_tests.js tests/admin_sports_game_organization_r2_tests.js; do
            [ -f "$test" ] || continue
            echo "=== $test ==="
            node "$test"
          done
      - name: Protection checks
        run: |
          git diff --check
          if git diff --name-only 2071060ffb6ffd6d2bd6d8a1fc87d5c4f3c8aa28 -- backend | grep -q .; then
            echo 'Protected backend changed'
            exit 1
          fi
      - name: Commit corrected R3
        run: |
          git config user.name 'PATTC Specialist'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Organize specialized sports admin pages R3'
          git push origin HEAD:fix/admin-specialized-manager-pages-r3

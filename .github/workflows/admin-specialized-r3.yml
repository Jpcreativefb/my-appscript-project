name: Admin Specialized Manager R3

on:
  push:
    branches:
      - fix/admin-specialized-manager-pages-r3

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/admin-specialized-manager-pages-r3
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply R3 presentation ownership patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/admin-specialized-r3-patch.py')
          s = p.read_text()

          start = s.index('# 3) Manage Games: remove obsolete R2 focus machinery entirely.')
          end = s.index('# Sports Pack / Playoff Timing: keep card builders + handlers, stop injecting Manage Games.')
          focus = '''# 3) Manage Games: remove obsolete R2 focus machinery entirely.\nfocus_start = games.find("/* ADMIN_SPORTS_GAME_ORGANIZATION_R2_FOCUS_START */")\nif focus_start >= 0:\n    focus_end = games.find("/* ADMIN_SPORTS_GAME_ORGANIZATION_R2_FOCUS_END */", focus_start)\n    if focus_end < 0:\n        raise SystemExit("R2 focus end marker missing")\n    focus_end += len("/* ADMIN_SPORTS_GAME_ORGANIZATION_R2_FOCUS_END */")\n    games = games[:focus_start] + games[focus_end:]\ngames = games.replace('    window.setTimeout(function() { adminManageGamesScheduleFocusR2_(0); }, 0);\\n', '')\ngames = games.replace(\n    'window.setTimeout(function() { adminManageGamesApplyCleanupR1_(); adminManageGamesScheduleFocusR2_(0); }, 0);',\n    'window.setTimeout(adminManageGamesApplyCleanupR1_, 0);'\n)\n\n'''
          s = s[:start] + focus + s[end:]

          start = s.index('# Futures: expose its existing presentation card for the Cup page, stop Manage Games injection.')
          end = s.index('# Cup Control: expose existing layout as a dedicated renderer, stop injecting Manage Games.')
          futures = '''# Futures: expose its existing presentation card for the Cup page, stop Manage Games injection.\nsection_start = games.index("/* PATTC NFL CUP + FUTURES R1")\nsection_end = games.index("/* PATTC NFL Cup Admin Control Center R1", section_start)\nsection = games[section_start:section_end]\nwrap_start = section.index("const BASE=root.renderAdminGamesPage;")\ncard_start = section.index("  const card='", wrap_start) + len("  const card='")\ncard_end = section.index("';\\n  const pos=html.indexOf", card_start)\ncard_literal = section[card_start:card_end]\nwrap_end = section.rindex("})(window);")\nsection = section[:wrap_start] + "root.nflCupFuturesAdminCardR3_=function(){return '" + card_literal + "';};\\n" + section[wrap_end:]\ngames = games[:section_start] + section + games[section_end:]\n\n'''
          p.write_text(s[:start] + futures + s[end:])
          PY
          python3 .github/admin-specialized-r3-patch.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/admin_specialized_manager_pages_r3_tests.js')
          s = p.read_text()
          replacements = {
            'assert(admin.includes("navigate(\'admin-team-fantasy\')">Team Fantasy Football"));': 'assert(admin.includes(`navigate(\'admin-team-fantasy\')">Team Fantasy Football`));',
            'assert(admin.includes("navigate(\'admin-playoff-race\')">Playoff Race"));': 'assert(admin.includes(`navigate(\'admin-playoff-race\')">Playoff Race`));',
            'assert(admin.includes("navigate(\'admin-nfl-cup\')">Cups / Combined Competitions → NFL Cup"));': 'assert(admin.includes(`navigate(\'admin-nfl-cup\')">Cups / Combined Competitions → NFL Cup`));',
            'assert(admin.includes("navigate(\'admin-nfl-season-setup\')">Season / Sports Setup → NFL Sports Pack"));': 'assert(admin.includes(`navigate(\'admin-nfl-season-setup\')">Season / Sports Setup → NFL Sports Pack`));',
            'assert(admin.includes("navigate(\'admin-sports-engine\')">Sports Engine Controls"));': 'assert(admin.includes(`navigate(\'admin-sports-engine\')">Sports Engine Controls`));'
          }
          for old, new in replacements.items():
            s = s.replace(old, new)
          p.write_text(s)
          PY
          rm -f .github/admin-specialized-r3-patch.py .github/workflows/admin-specialized-r3.yml
      - name: Syntax checks
        run: |
          node --check frontend/js/pages/admin.js
          node --check frontend/js/pages/adminGamesRc24e.js
          node --check frontend/js/pages/adminSportsManagersR3.js
          node --check frontend/js/app.js
          node --check tests/admin_specialized_manager_pages_r3_tests.js
      - name: R3 focused contracts
        run: node tests/admin_specialized_manager_pages_r3_tests.js
      - name: Existing Admin R1 tests
        run: |
          set -e
          for test in tests/admin_*r1*_tests.js; do
            [ -f "$test" ] || continue
            echo "=== $test ==="
            node "$test"
          done
      - name: Protection checks
        run: |
          git diff --check
          if git diff --name-only 2071060ffb6ffd6d2bd6d8a1fc87d5c4f3c8aa28 -- backend | grep -q .; then
            echo 'Protected backend changed'
            exit 1
          fi
      - name: Commit corrected R3
        run: |
          git config user.name 'PATTC Specialist'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Organize specialized sports admin pages R3'
          git push origin HEAD:fix/admin-specialized-manager-pages-r3

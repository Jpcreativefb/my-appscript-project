name: Awards App Production Checks

permissions:
  contents: write

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Visual Studio authority invariant
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/visual-studio-save-restore-color-authority-r1'
        run: python3 tools/apply_visual_studio_runtime_authority_invariant_r1.py

      - name: Validate and commit authority invariant
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/visual-studio-save-restore-color-authority-r1'
        run: |
          node --check frontend/js/ownerVisualStudioR3.js
          node tests/visual_studio_save_restore_color_authority_r1_tests.js
          git diff --check
          if git diff --quiet -- frontend/js/ownerVisualStudioR3.js; then
            echo "Authority invariant already applied"
            exit 0
          fi
          git config user.name "PATTC Specialist CI"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/js/ownerVisualStudioR3.js
          git commit -m "Make runtime appearance authority invariant in Visual Studio"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run production checks
        run: ./tools/run_production_checks.sh

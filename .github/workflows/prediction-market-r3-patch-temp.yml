name: Prediction Market R3 Validation Temp

on:
  push:
    branches:
      - feature/prediction-market-r9-admin-r3

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Correct structural test literals
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/prediction_market_admin_r3_tests.js')
          s=p.read_text()
          fixes={
            'assert(adminSource.includes("navigate(\'admin-team-fantasy\')">Team Fantasy Football"));': 'assert(adminSource.includes(`navigate(\'admin-team-fantasy\')">Team Fantasy Football`));',
            'assert(adminSource.includes("navigate(\'admin-playoff-race\')">Playoff Race"));': 'assert(adminSource.includes(`navigate(\'admin-playoff-race\')">Playoff Race`));',
            'assert(adminSource.includes("navigate(\'admin-nfl-cup\')">Cups / Combined Competitions → NFL Cup"));': 'assert(adminSource.includes(`navigate(\'admin-nfl-cup\')">Cups / Combined Competitions → NFL Cup`));',
            'assert(adminSource.includes("navigate(\'admin-sports-engine\')">Sports Engine Controls"));': 'assert(adminSource.includes(`navigate(\'admin-sports-engine\')">Sports Engine Controls`));'
          }
          for old,new in fixes.items():
              if s.count(old)!=1: raise SystemExit('missing expected test literal: '+old)
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/prediction_market_admin_r3_tests.js
          git commit -m "Fix Prediction Market R3 structural test literals"
          git push origin HEAD:feature/prediction-market-r9-admin-r3
      - name: Accepted R2 tests
        run: node tests/prediction_market_engine_r2_tests.js
      - name: Prediction Market R3 tests
        run: node tests/prediction_market_admin_r3_tests.js
      - name: Explicit diff check
        run: git diff --check 034c07729b283b94682ca8579a333c0c8fa41b28...HEAD
      - name: Full production checks
        run: bash tools/run_production_checks.sh

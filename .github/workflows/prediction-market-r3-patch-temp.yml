name: Prediction Market R3 Validation Temp

on:
  push:
    branches:
      - feature/prediction-market-r9-admin-r3

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Accepted R2 tests
        run: node tests/prediction_market_engine_r2_tests.js
      - name: Prediction Market R3 tests
        run: node tests/prediction_market_admin_r3_tests.js
      - name: Explicit diff check
        run: git diff --check 034c07729b283b94682ca8579a333c0c8fa41b28...HEAD
      - name: Full production checks
        run: bash tools/run_production_checks.sh

name: Prediction Market Community R1 Patch

on:
  push:
    branches:
      - feature/prediction-market-community-movement-r1

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply scoped community patch
        run: python3 tools/apply_prediction_market_community_r1.py
      - name: Focused community tests
        run: node tests/prediction_market_community_r1_tests.js
      - name: Explicit diff check
        run: git diff --check
      - name: Full production checks
        run: bash tools/run_production_checks.sh
      - name: Commit validated implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: add prediction market community movement analytics"
          git push origin HEAD:feature/prediction-market-community-movement-r1

name: Admin Sports R2 Correction

on:
  push:
    branches:
      - fix/admin-sports-game-organization-r2

permissions:
  contents: write

jobs:
  correct-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/admin-sports-game-organization-r2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply authoritative correction
        run: |
          python3 .github/admin-sports-r2-correction.py
          rm -f frontend/js/adminSportsGameOrganizationR2.js
          git checkout 0683d871826a56deca9b21e8b1121a78414411a9 -- frontend/js/nflWeekSurvivorPlayoffR1.js
          rm -f .github/admin-sports-r2-correction.py
          rm -f .github/workflows/admin-sports-r2-correction.yml

      - name: Syntax checks
        run: |
          node --check frontend/js/pages/admin.js
          node --check frontend/js/pages/adminGamesRc24e.js
          node --check frontend/js/nflWeekSurvivorPlayoffR1.js
          node --check tests/admin_sports_game_organization_r2_tests.js

      - name: R2 focused contracts
        run: node tests/admin_sports_game_organization_r2_tests.js

      - name: Existing Admin R1 tests
        run: |
          set -e
          found=0
          for test in tests/admin_*r1*_tests.js; do
            [ -f "$test" ] || continue
            found=1
            echo "=== $test ==="
            node "$test"
          done
          [ "$found" -eq 1 ]

      - name: Diff protection checks
        run: |
          git diff --check
          test ! -e frontend/js/adminSportsGameOrganizationR2.js
          ! grep -q 'adminSportsGameOrganizationR2' frontend/js/nflWeekSurvivorPlayoffR1.js
          if git diff --name-only 0683d871826a56deca9b21e8b1121a78414411a9 -- backend | grep -q .; then
            echo 'Protected backend changed'
            exit 1
          fi

      - name: Commit correction
        run: |
          git config user.name 'PATTC Specialist'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Correct Admin sports R2 delivery ownership'
          git push origin HEAD:fix/admin-sports-game-organization-r2

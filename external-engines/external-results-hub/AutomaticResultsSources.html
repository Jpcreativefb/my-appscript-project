<!doctype html><html><head><base target="_top"><style>body{font:13px Arial,sans-serif;padding:12px;color:#202124}h2{margin:0 0 12px}label{display:block;font-weight:600;margin:10px 0 4px}select,input{box-sizing:border-box;width:100%;padding:7px}input[type=checkbox]{width:auto}.row{display:flex;gap:8px;align-items:center;margin:7px 0}.row label{margin:0;font-weight:500}.card{border:1px solid #ddd;border-radius:8px;padding:10px;margin-top:12px}.status{white-space:pre-wrap;background:#f6f7f8;padding:8px;border-radius:6px;margin-top:8px}button{margin-top:12px;padding:9px 12px}.muted{color:#666;font-size:12px}</style></head><body><h2>Automatic Results Sources</h2><div class="muted">Fail-closed policy. Kalshi/Polymarket remain corroboration only. Reality roster changes always require native review.</div><label>Game</label><select id="game"></select><label>Category</label><select id="category"></select><label>Result Source</label><select id="source"><option value="manual-admin">Manual Admin</option><option value="official-academy">Official — Academy Awards / Oscars</option><option value="trusted-structured">Trusted Structured — configured source</option><option value="kalshi">Kalshi — Corroboration</option><option value="polymarket">Polymarket — Corroboration</option></select><label>Verification mode</label><select id="mode"><option value="MANUAL_APPROVAL">Manual Approval</option><option value="AUTO_APPROVE_WHEN_VERIFIED">Auto Approve When Verified</option><option value="MULTI_SOURCE_AUTO_APPROVE">Multi-Source Auto Approve</option></select><div class="row"><input id="monitor" type="checkbox"><label for="monitor">Monitor Automatically</label></div><div class="row"><input id="approval" type="checkbox" checked><label for="approval">Require Admin Approval</label></div><div class="row"><input id="auto" type="checkbox"><label for="auto">Auto Apply When Verified</label></div><label>Academy ceremony year</label><input id="year" placeholder="2026"><label>Official category name</label><input id="officialCategory"><label>Official source URL</label><input id="url" placeholder="https://www.oscars.org/oscars/ceremonies/2026"><button onclick="save()">Save Result Source Policy</button><button onclick="syncNow()">Check Sources Now</button><div class="card"><b>Source status</b><div id="status" class="status">Loading…</div></div><script>let state={games:[],categories:[],policies:[]};const e=id=>document.getElementById(id);function call(name,args,ok){google.script.run.withSuccessHandler(ok).withFailureHandler(err=>e('status').textContent='ERROR: '+err.message)[name](args);}function boot(){google.script.run.withSuccessHandler(data=>{state=data;renderGames();renderStatus();}).withFailureHandler(err=>e('status').textContent=err.message).getAutomaticResultsSourcesBootstrap();}function renderGames(){e('game').innerHTML=state.games.map(g=>`<option value="${g.gameId}">${g.name}</option>`).join('');e('game').onchange=renderCategories;renderCategories();}function renderCategories(){const gid=e('game').value,cs=state.categories.filter(c=>c.gameId===gid);e('category').innerHTML=cs.map(c=>`<option value="${c.categoryId}">${c.categoryName}</option>`).join('');e('category').onchange=loadPolicy;loadPolicy();}function loadPolicy(){const gid=e('game').value,cid=e('category').value,p=state.policies.find(x=>x.appGameId===gid&&x.categoryId===cid);const c=state.categories.find(x=>x.gameId===gid&&x.categoryId===cid);if(!p){e('source').value='manual-admin';e('mode').value='MANUAL_APPROVAL';e('monitor').checked=false;e('approval').checked=true;e('auto').checked=false;e('year').value='';e('officialCategory').value=c?c.categoryName:'';e('url').value='';renderStatus();return;}e('source').value=p.resultSource||'manual-admin';e('mode').value=p.verificationMode;e('monitor').checked=!!p.monitorAutomatically;e('approval').checked=!!p.requireAdminApproval;e('auto').checked=!!p.autoApplyWhenVerified;e('year').value=p.officialCeremonyYear||'';e('officialCategory').value=p.officialCategoryName||'';e('url').value=p.officialSourceUrl||'';renderStatus(p);}function renderStatus(p){p=p||state.policies.find(x=>x.appGameId===e('game').value&&x.categoryId===e('category').value);e('status').textContent=p?`Result Source: ${p.resultSource} (${p.sourceTier})\nLast Checked: ${p.lastChecked||'Never'}\nHealth: ${p.sourceHealth||'UNKNOWN'}${p.lastError?' · '+p.lastError:''}\nDetected Result: ${p.detectedResult||'—'}\nSource Agreement / Confidence: ${p.sourceAgreement||'—'} · ${p.confidence||'—'}\nFinalized: ${p.finalized?'YES':'NO'}${p.finalizedEvidenceUrl?' · '+p.finalizedEvidenceUrl:''}`:'No policy saved.';}function save(){call('saveAutomaticResultSourcePolicy',{appGameId:e('game').value,categoryId:e('category').value,resultSource:e('source').value,verificationMode:e('mode').value,monitorAutomatically:e('monitor').checked,requireAdminApproval:e('approval').checked,autoApplyWhenVerified:e('auto').checked,officialCeremonyYear:e('year').value,officialCategoryName:e('officialCategory').value,officialSourceUrl:e('url').value,expectedWinnerCount:1,stableChecksRequired:2,staleAfterMinutes:180},()=>boot());}function syncNow(){e('status').textContent='Checking…';google.script.run.withSuccessHandler(()=>boot()).withFailureHandler(err=>e('status').textContent='ERROR: '+err.message).syncAutomaticResultSourcesNow();}boot();</script></body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Castle Encounter Prototype R3</title>
<style>
:root{--gold:#d7b15c;--cream:#f6edd9;--muted:#b8b0a1;--panel:rgba(8,8,8,.79);--line:rgba(215,177,92,.5);--red:#8c1515}
*{box-sizing:border-box}body{margin:0;background:#050505;color:var(--cream);font-family:Georgia,"Times New Roman",serif}button{font:inherit}.shell{min-height:100vh;background:linear-gradient(rgba(0,0,0,.38),rgba(0,0,0,.84)),url('./assets/castle/rooms/strategy-chamber-modern.webp') center/cover fixed;padding:14px 11px 30px;transition:filter .3s,background .3s}.phone{max-width:430px;margin:auto}.eyebrow{font:700 11px Arial,sans-serif;letter-spacing:.16em;color:var(--gold);text-transform:uppercase}.title{font-size:29px;margin:5px 0 2px}.small{font:13px/1.45 Arial,sans-serif;color:#d5d0c6}.tabs{display:flex;gap:6px;overflow:auto;margin:11px 0}.tabs button{white-space:nowrap;border:1px solid #6d5828;background:#101010;color:#ddd;padding:9px;border-radius:2px}.tabs button.active{background:var(--gold);color:#171109}.card{border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(4px);padding:14px;margin-bottom:11px;border-radius:2px}.big{font-size:24px;margin:4px 0 8px}.btn{min-height:46px;border:1px solid var(--gold);background:#131313;color:var(--cream);padding:10px;border-radius:2px}.btn.primary,.btn.selected{background:var(--gold);color:#181208;font-weight:800}.btn:disabled{opacity:.4}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.status{font:700 13px/1.45 Arial,sans-serif;color:#f5dfa5;margin-top:10px}.grid6{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tile,.fate-card{aspect-ratio:1/1.08;border:1px solid #755f2c;background:linear-gradient(145deg,#1d1810,#090806);color:var(--cream);padding:6px;text-align:center;border-radius:2px}.tile.revealed{background:#2b2415;outline:2px solid var(--gold)}.tile.faded,.fate-card.faded{filter:grayscale(1);opacity:.3}.reward-note{display:block;font:10px/1.25 Arial,sans-serif;color:#cfc5b1;margin-top:5px}.countdown{font:800 18px Arial,sans-serif;color:var(--gold);text-align:center;margin:9px 0}.full{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 35%,#33130d,#070707 68%);display:none;place-items:center;padding:20px;text-align:center}.full.show{display:grid}.full .panel{max-width:430px;width:100%}.full h2{font-size:42px;margin:8px 0}.full.murder{background:radial-gradient(circle,#930000 0,#2b0000 48%,#030000 100%)}.murder-word{font:900 clamp(56px,18vw,102px)/.88 Arial,sans-serif;color:#fff}.wheel-wrap{display:grid;place-items:center;margin:10px 0}.pointer{width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:23px solid var(--gold);margin-bottom:-7px;z-index:2}.wheel{width:270px;height:270px;border-radius:50%;border:7px solid #463916;position:relative;background:conic-gradient(#641919 0 45deg,#1d1d1d 45deg 90deg,#70591d 90deg 135deg,#292929 135deg 180deg,#641919 180deg 225deg,#1d1d1d 225deg 270deg,#70591d 270deg 315deg,#292929 315deg 360deg);transition:transform 2.4s cubic-bezier(.12,.72,.08,1)}.wheel span{position:absolute;left:50%;top:50%;width:84px;margin-left:-42px;text-align:center;font:700 10px Arial,sans-serif;transform-origin:42px 0}.wheel:after{content:'MURDER';position:absolute;inset:98px;border-radius:50%;background:#070707;border:2px solid var(--gold);display:grid;place-items:center;font:800 11px Arial,sans-serif;letter-spacing:.12em}.spins{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.spin-slot{min-height:62px;border:1px solid #655124;background:#111;padding:7px;text-align:center;font:12px Arial,sans-serif}.players{display:grid;gap:7px;margin:10px 0}.player{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;border:1px solid #4f4224;background:#101010;padding:9px;font:12px Arial,sans-serif}.player button{min-height:34px}.fate-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.shell.red1{background:linear-gradient(rgba(70,0,0,.25),rgba(0,0,0,.84)),url('./assets/castle/rooms/strategy-chamber-modern.webp') center/cover fixed}.shell.red2{background:linear-gradient(rgba(115,0,0,.42),rgba(0,0,0,.82)),url('./assets/castle/rooms/strategy-chamber-modern.webp') center/cover fixed}.shell.red3{background:linear-gradient(rgba(170,0,0,.6),rgba(8,0,0,.86)),url('./assets/castle/rooms/strategy-chamber-modern.webp') center/cover fixed}
</style>
</head>
<body>
<div class="shell" id="shell"><div class="phone"><div class="eyebrow">PATTC CASTLE · INTERACTION PROOF R3</div><h1 class="title">Encounter Lab</h1><p class="small">Presentation proof only. Live integration will use persisted backend outcomes.</p><div class="tabs" id="tabs"></div><main id="stage"></main></div></div>
<div class="full" id="result"><div class="panel" id="resultPanel"></div></div>
<script>
(function(){
const views=['Regular Host','Masked Host','Masked Faithful','Murderer Wheel','Traitor Fate'];let current=0,s={};
const $=x=>document.getElementById(x),stage=$('stage'),tabs=$('tabs'),shell=$('shell'),result=$('result'),panel=$('resultPanel');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const remarks={host:['The Host is smiling. That is rarely comforting.','Pick carefully. The Castle remembers confidence.','Three chances. Try not to embarrass yourself.'],wheel:['Round and round. Regrets are free.','Interesting. The wheel seems amused.','Last chance — you better get something!'],murder:['Go ahead, you little devil. Choose carefully.','Someone is about to have a very bad night.','Keep it secret, or show your murderous side — your choice.']};
const hostRewards=[{k:'LIFE SHIELD',d:'Blocks one eligible murder attempt. Appears beside your Banish/Lives status and is consumed when it protects you.'},{k:'BIG BONUS',d:'Awards the Host bonus immediately to your Castle score.'},{k:'BANISH REDUCTION',d:'Reduces your current Banish pressure when the reward is earned.'}];
function reset(){s={hostOwn:'',hostGuess:'',hostDone:false,hostAnswer:pick(['COOPERATE','BETRAY']),mhDeck:shuffle([0,0,1,1,2,2]),mhPicks:[],mhDone:false,mfDeck:shuffle(['Alliance · 3× wager','Alliance · 2× wager','Alliance · 2× wager','Alliance · wager returned','Faithful · +Alliance','Faithful · +Alliance']),mfPick:null,mfChoice:'',mfDone:false,wheel:[],rot:0,spinBusy:false,murderReady:false,fateDeck:shuffle(['DAGGER','POISON','ROPE','WRENCH','SAFE','SAFE','SAFE','SAFE','SAFE']),fate:[],murders:0,safes:0,lastWeapon:'',lives:3};shell.className='shell';closeResult();render()}
function tabBar(){tabs.innerHTML=views.map((v,i)=>`<button class="${i===current?'active':''}" data-tab="${i}">${v}</button>`).join('');tabs.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{current=+b.dataset.tab;reset()})}
function showResult(html,cls){panel.innerHTML=html;result.className='full show'+(cls?' '+cls:'');panel.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>{closeResult();current=Math.min(views.length-1,current+1);reset()})}
function closeResult(){result.className='full';panel.innerHTML=''}
function regularHost(){return `<section class="card"><div class="eyebrow">REGULAR HOST ENCOUNTER</div><h2 class="big">The Host decides now.</h2><p class="small">Choose your move and predict the Host. This proof resolves immediately.</p><div class="status">YOUR MOVE</div><div class="choices"><button class="btn ${s.hostOwn==='COOPERATE'?'selected':''}" data-ho="COOPERATE">COOPERATE</button><button class="btn ${s.hostOwn==='BETRAY'?'selected':''}" data-ho="BETRAY">BETRAY</button></div><div class="status">PREDICT THE HOST</div><div class="choices"><button class="btn ${s.hostGuess==='COOPERATE'?'selected':''}" data-hg="COOPERATE">COOPERATE</button><button class="btn ${s.hostGuess==='BETRAY'?'selected':''}" data-hg="BETRAY">BETRAY</button></div><button class="btn primary" id="hostPlay" style="width:100%;margin-top:10px" ${s.hostOwn&&s.hostGuess?'':'disabled'}>PLAY NOW</button></section>`}
function maskedHost(){let done=s.mhDone;return `<section class="card"><div class="eyebrow">MASKED HOST</div><h2 class="big">Find a matching reward</h2><p class="small">Six Host cards. Three picks. Match two of the same reward to earn it. No match returns your wager.</p>${s.mhPicks.length&&!done?`<div class="countdown">${3-s.mhPicks.length} PICK${3-s.mhPicks.length===1?'':'S'} LEFT</div><div class="status">${pick(remarks.host)}</div>`:''}<div class="grid6">${s.mhDeck.map((ri,i)=>{let open=s.mhPicks.includes(i)||done,r=hostRewards[ri];return `<button class="tile ${open?'revealed':''}" data-mh="${i}" ${done||s.mhPicks.includes(i)?'disabled':''}>${open?`${r.k}<span class="reward-note">${r.d}</span>`:'HOST'}</button>`}).join('')}</div></section>`}
function maskedFaithful(){return `<section class="card"><div class="eyebrow">MASKED FAITHFUL</div><h2 class="big">Pick a Card</h2><p class="small">Choose one facedown contestant. Alliance cards carry wager rewards. A Faithful outside your Castle 5 can become an additional Alliance member if you win Cooperate/Betray.</p><div class="grid6">${s.mfDeck.map((v,i)=>{let chosen=s.mfPick===i,other=s.mfPick!==null&&!chosen;return `<button class="tile ${chosen?'revealed':''} ${other?'faded':''}" data-mf="${i}" ${s.mfPick!==null?'disabled':''}>${chosen?v:other?v:'TV CONTESTANT'}</button>`}).join('')}</div>${s.mfPick!==null&&!s.mfDone?`<div class="status">COOPERATE OR BETRAY</div><div class="choices"><button class="btn ${s.mfChoice==='COOPERATE'?'selected':''}" data-mfc="COOPERATE">COOPERATE</button><button class="btn ${s.mfChoice==='BETRAY'?'selected':''}" data-mfc="BETRAY">BETRAY</button></div><button class="btn primary" id="mfPlay" style="width:100%;margin-top:10px" ${s.mfChoice?'':'disabled'}>PLAY NOW</button>`:''}</section>`}
const wheelItems=['DAGGER','MURDER KEY','MURDERER CARD','POISON','ROPE','WRENCH','CANDLESTICK','TOASTER'];
function wheelLabels(){return wheelItems.map((x,i)=>`<span style="transform:rotate(${i*45}deg) translate(0,-112px) rotate(${-i*45}deg)">${x}</span>`).join('')}
function murdererWheel(){return `<section class="card"><div class="eyebrow">MASKED MURDERER</div><h2 class="big">The Murder Wheel</h2><p class="small">Three real-looking spins. Match any symbol twice to strengthen your secret murder. No match still grants the standard murder.</p><div class="wheel-wrap"><div class="pointer"></div><div class="wheel" id="wheel" style="transform:rotate(${s.rot}deg)">${wheelLabels()}</div></div><div class="status">${s.wheel.length?remarks.wheel[Math.min(s.wheel.length-1,2)]:'The wheel is waiting.'}</div><button class="btn primary" id="spin" style="width:100%;margin-top:8px" ${s.spinBusy||s.wheel.length>=3?'disabled':''}>${s.wheel.length>=3?'SPINS COMPLETE':'SPIN '+(s.wheel.length+1)}</button><div class="spins">${[0,1,2].map(i=>`<div class="spin-slot">${s.wheel[i]||'—'}</div>`).join('')}</div></section>`}
function fate(){let done=s.murders>=3||s.safes>=3;return `<section class="card"><div class="eyebrow">TRAITOR · FATE</div><h2 class="big">Choose an envelope</h2><p class="small">The nine Fate cards are reshuffled every new Fate encounter. First to 3 Murder or 3 Safe ends the game.</p><div class="fate-grid">${s.fateDeck.map((v,i)=>{let open=s.fate.includes(i)||done,unpicked=done&&!s.fate.includes(i);return `<button class="fate-card ${unpicked?'faded':''}" data-fate="${i}" ${open?'disabled':''}>${open?v:'SEALED'}</button>`}).join('')}</div><div class="status">MURDER ${s.murders}/3 · SAFE ${s.safes}/3</div></section>`}
function render(){tabBar();stage.innerHTML=current===0?regularHost():current===1?maskedHost():current===2?maskedFaithful():current===3?murdererWheel():fate();wire()}
function wire(){
stage.querySelectorAll('[data-ho]').forEach(b=>b.onclick=()=>{s.hostOwn=b.dataset.ho;render()});stage.querySelectorAll('[data-hg]').forEach(b=>b.onclick=()=>{s.hostGuess=b.dataset.hg;render()});let hp=$('hostPlay');if(hp)hp.onclick=()=>{let right=s.hostGuess===s.hostAnswer;showResult(`<div class="eyebrow">HOST RESULT</div><h2>${right?'YOU READ THE HOST':'THE HOST READ YOU'}</h2><p class="small">Host chose <strong>${s.hostAnswer}</strong>. ${right?'Correct prediction — immediate Host scoring/protection applies.':'Wrong prediction — no Host reward in this proof.'}</p><button class="btn primary" data-next style="width:100%;margin-top:16px">NEXT ENCOUNTER</button>`)};
stage.querySelectorAll('[data-mh]').forEach(b=>b.onclick=()=>{let i=+b.dataset.mh;if(s.mhPicks.includes(i)||s.mhDone)return;s.mhPicks.push(i);let picks=s.mhPicks.map(x=>s.mhDeck[x]),match=picks.find((x,n)=>picks.indexOf(x)!==n);if(match!==undefined||s.mhPicks.length===3){s.mhDone=true;render();setTimeout(()=>{let r=match!==undefined?hostRewards[match]:null;showResult(`<div class="eyebrow">MASKED HOST RESULT</div><h2>${r?r.k:'WAGER RETURNED'}</h2><p class="small">${r?r.d:'No matching pair in three picks. Your wager is returned.'}</p>${r&&r.k==='LIFE SHIELD'?'<div class="status">🛡 Life Shield added beside Lives / Banish status.</div>':''}<button class="btn primary" data-next style="width:100%;margin-top:16px">NEXT ENCOUNTER</button>`);},700)}else render()});
stage.querySelectorAll('[data-mf]').forEach(b=>b.onclick=()=>{if(s.mfPick!==null)return;s.mfPick=+b.dataset.mf;render()});stage.querySelectorAll('[data-mfc]').forEach(b=>b.onclick=()=>{s.mfChoice=b.dataset.mfc;render()});let mp=$('mfPlay');if(mp)mp.onclick=()=>{let good=Math.random()<.8,reward=s.mfDeck[s.mfPick],outside=reward.indexOf('+Alliance')>-1;s.mfDone=true;showResult(`<div class="eyebrow">FAITHFUL RESULT</div><h2>${good?'YOU GOT IT RIGHT':'WRONG READ'}</h2><p class="small">${good?(outside?'New Alliance member earned.':reward+' earned.'):'Wager lost. No additional penalty.'}</p><button class="btn primary" data-next style="width:100%;margin-top:16px">NEXT ENCOUNTER</button>`)};
let sp=$('spin');if(sp)sp.onclick=()=>{if(s.spinBusy||s.wheel.length>=3)return;s.spinBusy=true;let symbol=pick(wheelItems),mode=pick(['FAST STOP','SLOW STOP','LONG RANDOM']),extra=mode==='FAST STOP'?760:mode==='SLOW STOP'?1080:900+Math.floor(Math.random()*900);s.rot+=extra;render();setTimeout(()=>{s.wheel.push(symbol);s.spinBusy=false;let counts={};s.wheel.forEach(x=>counts[x]=(counts[x]||0)+1),match=Object.keys(counts).find(x=>counts[x]>=2);if(s.wheel.length>=3){render();setTimeout(()=>showResult(`<div class="eyebrow">MURDERER</div><h2>${match?'MURDER UPGRADED':'SECRET MURDER UNLOCKED'}</h2><p class="small">${pick(remarks.murder)}</p><div class="players"><div class="player"><strong>Alex</strong><span>Lives 3</span><span>420 pts</span><span>#2</span></div><div class="player"><strong>Jordan</strong><span>Lives 2</span><span>390 pts</span><span>#4</span></div><div class="player"><strong>Casey</strong><span>Lives 1</span><span>355 pts</span><span>#6</span></div></div><p class="small">Your murder choice remains secret until the end of the Castle game.</p><button class="btn primary" data-next style="width:100%;margin-top:12px">SEAL MURDER & NEXT ENCOUNTER</button>`),350)}else render()},mode==='FAST STOP'?900:mode==='SLOW STOP'?2500:1700)};
stage.querySelectorAll('[data-fate]').forEach(b=>b.onclick=()=>{let i=+b.dataset.fate;if(s.fate.includes(i)||s.murders>=3||s.safes>=3)return;s.fate.push(i);let v=s.fateDeck[i];if(v==='SAFE')s.safes++;else{s.murders++;s.lastWeapon=v}shell.className='shell red'+Math.min(3,s.murders);render();if(s.safes>=3){setTimeout(()=>showResult(`<div class="eyebrow">FATE RESULT</div><h2>YOU SURVIVED THE NIGHT</h2><p class="small">The remaining Fate cards have been revealed and faded.</p><button class="btn primary" data-next style="width:100%;margin-top:14px">NEXT ENCOUNTER</button>`),450)}else if(s.murders>=3){s.lives=Math.max(0,s.lives-1);let traitor=pick(['Current Traitor A','Current Traitor B','Current Traitor C']);setTimeout(()=>showResult(`<div class="murder-word">MURDERED!</div><h2>Death by ${s.lastWeapon}</h2><p class="small">The Castle points to <strong>${traitor}</strong>.</p><div class="status">Castle lives remaining: ${s.lives}</div><button class="btn primary" data-next style="width:100%;margin-top:14px">NEXT ENCOUNTER</button>`,'murder'),220)}})}
reset();
})();
</script>
</body></html>

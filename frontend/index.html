<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="
    width=device-width,
    initial-scale=1,
    viewport-fit=cover
  "
>

<title>Awards App</title>

<link
  rel="stylesheet"
  href="./css/styles.css"
>

</head>

<body>

<div class="login-page">

  <div class="login-card">

    <div class="login-title">
      🏆 Awards App
    </div>

    <div class="login-sub" id="authSubtitle">
      Sign in to continue
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" onclick="showAuthView('login')">Login</button>
      <button class="auth-tab" onclick="showAuthView('signup')">Sign Up</button>
      <button class="auth-tab" onclick="showAuthView('reset')">Reset PIN</button>
    </div>

    <div id="loginView" class="auth-view">

      <input
        id="username"
        class="input"
        placeholder="Username, email, or phone"
        autocomplete="username"
      >

      <input
        id="pin"
        class="input"
        placeholder="PIN"
        inputmode="numeric"
        maxlength="4"
        type="password"
      >

      <button
        class="button"
        onclick="login()"
      >
        Login
      </button>

    </div>

    <div id="signupView" class="auth-view hidden">

      <input
        id="signupUsername"
        class="input"
        placeholder="Choose a username"
        autocomplete="username"
      >


      <input
        id="signupRealName"
        class="input"
        placeholder="Real name optional — shown in admin/leaderboards"
        autocomplete="name"
      >

      <input
        id="signupEmail"
        class="input"
        placeholder="Email optional — only needed for reset codes and updates"
        autocomplete="email"
        type="email"
      >

      <input
        id="signupPhone"
        class="input"
        placeholder="Phone optional — saved only, no automatic texts"
        autocomplete="tel"
        inputmode="tel"
        type="tel"
      >

      <input
        id="signupPin"
        class="input"
        placeholder="Choose a 4-digit PIN"
        inputmode="numeric"
        maxlength="4"
        type="password"
      >

      <div class="preference-card">
        <div class="preference-title">Contact Preference</div>

        <label class="radio-row">
          <input name="signupContactMethod" type="radio" value="none" checked>
          <span>Play only — no email, phone, or notifications required</span>
        </label>

        <label class="radio-row">
          <input name="signupContactMethod" type="radio" value="email">
          <span>Email me game updates and allow PIN reset by email</span>
        </label>

        <label class="radio-row">
          <input name="signupContactMethod" type="radio" value="phone">
          <span>Save my phone on profile only — no automatic texts</span>
        </label>
      </div>

      <div class="auth-note">
        Email and phone are optional. Without email, forgotten PINs must be reset by an admin.
      </div>

      <button
        class="button"
        onclick="signup()"
      >
        Create Account
      </button>

    </div>

    <div id="resetView" class="auth-view hidden">

      <input
        id="resetIdentifier"
        class="input"
        placeholder="Username or email"
        autocomplete="username"
      >

      <button
        class="button secondary-button"
        onclick="requestPinReset()"
      >
        Send Reset Code
      </button>

      <div class="auth-note">
        Reset codes are emailed only. Accounts without email can still play, but need an admin PIN reset if forgotten.
      </div>

      <input
        id="resetCode"
        class="input"
        placeholder="6-digit reset code"
        inputmode="numeric"
        maxlength="6"
      >

      <input
        id="newPin"
        class="input"
        placeholder="New 4-digit PIN"
        inputmode="numeric"
        maxlength="4"
        type="password"
      >

      <button
        class="button"
        onclick="resetPin()"
      >
        Save New PIN
      </button>

    </div>

    <div
      id="authMessage"
      class="error hidden"
    ></div>

  </div>

</div>

<script src="./js/config.js"></script>
<script src="./js/api.js"></script>
<script src="./js/auth.js"></script>

</body>
</html>

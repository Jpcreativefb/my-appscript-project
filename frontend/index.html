<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="
    width=device-width,
    initial-scale=1,
    viewport-fit=cover
  "
>

<title>PATTC PREDICTIONS</title>

<!-- =========================
     PWA / MOBILE APP SUPPORT
========================= -->

<link
  rel="manifest"
  href="./manifest.webmanifest"
>

<meta
  name="theme-color"
  content="#111827"
>

<meta
  name="application-name"
  content="PATTC Predicts"
>

<meta
  name="mobile-web-app-capable"
  content="yes"
>

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<meta
  name="apple-mobile-web-app-title"
  content="PATTC Predicts"
>

<meta
  name="apple-mobile-web-app-status-bar-style"
  content="black-translucent"
>

<link
  rel="apple-touch-icon"
  href="./icons/icon-192-v2.png"
>

<link
  rel="icon"
  type="image/png"
  sizes="192x192"
  href="./icons/icon-192-v2.png"
>

<link
  rel="icon"
  type="image/png"
  sizes="512x512"
  href="./icons/icon-512-v2.png"
>

<link
  rel="stylesheet"
  href="./css/styles.css?v=311-external-results-inbox"
>

</head>

<body>

<div class="login-page">

  <div class="login-card">

    <div class="login-title">
      🏆 PATTC Predicts 🏆
    </div>

    <div class="login-sub" id="authSubtitle">
      Sign in to continue
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" onclick="showAuthView('login')">Login</button>
      <button class="auth-tab" onclick="showAuthView('signup')">Sign Up</button>
      <button class="auth-tab" onclick="showAuthView('reset')">Reset PIN</button>
    </div>

    <div id="loginView" class="auth-view">

      <input
        id="username"
        class="input"
        placeholder="Username, email, or phone"
        autocomplete="username"
      >

      <input
        id="pin"
        class="input"
        placeholder="PIN"
        inputmode="numeric"
        maxlength="4"
        type="password"
      >

      <label class="remember-row">
        <input
          id="rememberDevice"
          type="checkbox"
          checked
        >
        <span>Keep me signed in on this device</span>
      </label>

      <button
        class="button"
        onclick="login()"
      >
        Login
      </button>

    </div>

    <div id="signupView" class="auth-view hidden">

      <input
        id="signupUsername"
        class="input"
        placeholder="Choose a username"
        autocomplete="username"
      >

      <input
        id="signupRealName"
        class="input"
        placeholder="Real name optional — shown in admin/leaderboards"
        autocomplete="name"
      >

      <input
        id="signupEmail"
        class="input"
        placeholder="Email optional — only needed for reset codes and updates"
        autocomplete="email"
        type="email"
      >

      <input
        id="signupPhone"
        class="input"
        placeholder="Phone optional — saved only, no automatic texts"
        autocomplete="tel"
        inputmode="tel"
        type="tel"
      >

      <input
        id="signupPin"
        class="input"
        placeholder="Choose a 4-digit PIN"
        inputmode="numeric"
        maxlength="4"
        type="password"
      >

      <div class="preference-card">
        <div class="preference-title">Contact Preference</div>

        <label class="radio-row">
          <input name="signupContactMethod" type="radio" value="none" checked>
          <span>Play only — no email, phone, or notifications required</span>
        </label>

        <label class="radio-row">
          <input name="signupContactMethod" type="radio" value="email">
          <span>Email me game updates and allow PIN reset by email</span>
        </label>

        <label class="radio-row">
          <input name="signupContactMethod" type="radio" value="phone">
          <span>Save my phone on profile only — no automatic texts</span>
        </label>
      </div>

      <div class="auth-note">
        Email and phone are optional. Without email, forgotten PINs must be reset by an admin.
      </div>

      <button
        class="button"
        onclick="signup()"
      >
        Create Account
      </button>

    </div>

    <div id="resetView" class="auth-view hidden">

      <input
        id="resetIdentifier"
        class="input"
        placeholder="Username or email"
        autocomplete="username"
      >

      <button
        class="button secondary-button"
        onclick="requestPinReset()"
      >
        Send Reset Code
      </button>

      <div class="auth-note">
        Reset codes are emailed only. Accounts without email can still play, but need an admin PIN reset if forgotten.
      </div>

      <input
        id="resetCode"
        class="input"
        placeholder="6-digit reset code"
        inputmode="numeric"
        maxlength="6"
      >

      <input
        id="newPin"
        class="input"
        placeholder="New 4-digit PIN"
        inputmode="numeric"
        maxlength="4"
        type="password"
      >

      <button
        class="button"
        onclick="resetPin()"
      >
        Save New PIN
      </button>

    </div>

    <div
      id="authMessage"
      class="error hidden"
    ></div>

  </div>

</div>

<script src="./js/config.js"></script>

</body>
</html>

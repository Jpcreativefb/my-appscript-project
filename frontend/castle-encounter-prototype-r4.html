<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Castle Encounter Prototype R4</title>
<style>
:root{--gold:#d7b15c;--cream:#f6edd9;--muted:#b8b0a1;--panel:rgba(7,7,7,.82);--line:rgba(215,177,92,.48);--red:#980f16}
*{box-sizing:border-box;min-width:0}html,body{margin:0;background:#050505;color:var(--cream);font-family:Georgia,"Times New Roman",serif;overflow-x:hidden}button{font:inherit;max-width:100%}.shell{min-height:100vh;background:linear-gradient(rgba(0,0,0,.4),rgba(0,0,0,.86)),url('./assets/castle/rooms/strategy-chamber-modern.webp') center/cover fixed;padding:12px 9px 28px}.phone{width:100%;max-width:430px;margin:auto;overflow:hidden}.eyebrow{font:700 10px Arial,sans-serif;letter-spacing:.15em;color:var(--gold);text-transform:uppercase}.title{font-size:27px;margin:4px 0}.small{font:12px/1.45 Arial,sans-serif;color:#d8d2c6}.tabs{display:flex;gap:5px;overflow-x:auto;padding-bottom:5px;margin:9px 0}.tabs button{flex:0 0 auto;white-space:nowrap;border:1px solid #6d5828;background:#101010;color:#ddd;padding:8px 9px;border-radius:2px}.tabs button.active{background:var(--gold);color:#171109}.card{width:100%;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(4px);padding:12px;margin-bottom:10px;border-radius:2px;overflow:hidden}.big{font-size:22px;margin:4px 0 7px}.btn{min-height:44px;border:1px solid var(--gold);background:#131313;color:var(--cream);padding:9px;border-radius:2px}.btn.primary,.btn.selected{background:var(--gold);color:#181208;font-weight:800}.btn.blood{background:#8c0b12;border-color:#ff5b63;color:#fff;box-shadow:0 0 0 2px rgba(255,70,70,.18) inset}.btn:disabled{opacity:.38}.choices{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:7px}.status{font:700 12px/1.4 Arial,sans-serif;color:#f5dfa5;margin-top:8px}.grid6,.fate-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.tile,.fate-card{width:100%;aspect-ratio:1/1.08;border:1px solid #755f2c;background:linear-gradient(145deg,#1d1810,#090806);color:var(--cream);padding:5px;text-align:center;border-radius:2px;overflow:hidden;font-size:11px}.tile.revealed{background:#2b2415;outline:2px solid var(--gold)}.tile.faded,.fate-card.faded{filter:grayscale(1);opacity:.26}.reward-note{display:block;font:9px/1.2 Arial,sans-serif;color:#cec3ad;margin-top:4px}.masked-entry{position:relative;height:190px;border:1px solid var(--line);background:radial-gradient(circle at 50% 36%,#34312c,#090909 58%,#020202);overflow:hidden;margin-bottom:10px}.masked-row{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;align-items:end;gap:9px}.mask{width:64px;height:130px;background:linear-gradient(#242424,#080808);clip-path:polygon(20% 0,80% 0,100% 28%,88% 100%,12% 100%,0 28%);position:relative}.mask:before{content:'';position:absolute;left:50%;top:12px;transform:translateX(-50%);width:38px;height:32px;border-radius:50%;background:#bbb6aa;box-shadow:inset 0 -8px 0 #777}.mask.center{transform:scale(1.14);z-index:2}.envelope{position:absolute;left:50%;bottom:24px;transform:translateX(-50%) rotate(-5deg);width:78px;height:48px;background:#e3d3b1;color:#332511;border:1px solid #8a7341;display:grid;place-items:center;font:800 10px Arial,sans-serif}.count{font:800 17px Arial,sans-serif;color:var(--gold);text-align:center;margin:8px 0}.full{position:fixed;inset:0;z-index:60;background:radial-gradient(circle at 50% 35%,#35140f,#050505 70%);display:none;place-items:center;padding:18px;text-align:center;overflow:auto}.full.show{display:grid}.full.murder{background:radial-gradient(circle,#980000 0,#300000 46%,#020000 100%)}.panel{width:100%;max-width:430px}.panel h2{font-size:38px;margin:7px 0}.wheel-wrap{display:grid;place-items:center;margin:8px 0}.pointer{width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:22px solid var(--gold);margin-bottom:-6px;z-index:2}.wheel{width:min(78vw,280px);height:min(78vw,280px);border-radius:50%;border:7px solid #463916;position:relative;background:conic-gradient(#641919 0 45deg,#1d1d1d 45deg 90deg,#70591d 90deg 135deg,#292929 135deg 180deg,#641919 180deg 225deg,#1d1d1d 225deg 270deg,#70591d 270deg 315deg,#292929 315deg 360deg);transition-property:transform;transform-origin:center}.wheel span{position:absolute;left:50%;top:50%;width:78px;margin-left:-39px;text-align:center;font:700 9px Arial,sans-serif;transform-origin:39px 0}.wheel:after{content:'MURDER';position:absolute;inset:36%;border-radius:50%;background:#070707;border:2px solid var(--gold);display:grid;place-items:center;font:800 10px Arial,sans-serif;letter-spacing:.1em}.spins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.spin-slot{min-height:58px;border:1px solid #655124;background:#111;padding:6px;text-align:center;font:11px Arial,sans-serif}.benefits{display:grid;gap:7px;margin-top:9px}.benefit{border:1px solid #5d4b25;background:#111;padding:9px;text-align:left}.players{display:grid;gap:6px;margin-top:9px}.player{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center;border:1px solid #4f4224;background:#101010;padding:8px;font:11px Arial,sans-serif}.player-meta{font-size:10px;color:#cfc8bb}.portrait{width:70px;height:92px;border:2px solid var(--gold);margin:8px auto;background:#151515;display:grid;place-items:center;font-size:30px}
@media(max-width:360px){.grid6,.fate-grid{gap:4px}.tile,.fate-card{font-size:10px;padding:4px}.card{padding:10px}.mask{width:57px;height:118px}.masked-row{gap:5px}.panel h2{font-size:33px}.choices{grid-template-columns:1fr}}
</style></head><body>
<div class="shell" id="shell"><div class="phone"><div class="eyebrow">PATTC CASTLE · INTERACTION PROOF R4</div><h1 class="title">Encounter Lab</h1><p class="small">Mobile-first presentation proof. Live game will persist authoritative outcomes server-side.</p><div class="tabs" id="tabs"></div><main id="stage"></main></div></div>
<div class="full" id="full"><div class="panel" id="panel"></div></div>
<script>
(function(){
const views=['Regular Host','Masked Host','Masked Faithful','Murderer Wheel','Traitor Fate'];let current=0,s={},timers=[];const $=id=>document.getElementById(id),stage=$('stage'),tabs=$('tabs'),full=$('full'),panel=$('panel'),shell=$('shell');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};const pick=a=>a[Math.floor(Math.random()*a.length)];
const hostRewards=[{k:'LIFE SHIELD',d:'Blocks one eligible murder attempt. It appears beside Lives / Banish until used.'},{k:'BIG BONUS',d:'Adds the Host bonus to your Castle score immediately.'},{k:'BANISH REDUCTION',d:'Removes one current Banish pressure when earned.'}];
const remarks={host:['One down. The masks are judging you.','Two choices made. Feeling lucky?','Last pick. Try not to waste it.'],wheel:['Round and round. Someone should be nervous.','That was almost useful. Spin again.','Last chance — you better get something!'],murder:['Go ahead, you little devil — choose your victim.','Someone is about to have a very bad Castle night.','Keep it secret or show your murderous side. Your choice.']};
const users=[['Art',3,740,1],['Maria',2,690,2],['Chris',3,620,3],['Jordan',1,590,4],['Sam',2,530,5]];
function clearTimers(){timers.forEach(clearTimeout);timers=[]}function later(fn,ms){let t=setTimeout(fn,ms);timers.push(t);return t}
function reset(){clearTimers();s={hostOwn:'',hostGuess:'',hostAnswer:pick(['COOPERATE','BETRAY']),mhDeck:shuffle([0,0,1,1,2,2]),mhPicks:[],mhResolved:false,mhReward:null,mfDeck:shuffle(['Alliance · 3× wager','Alliance · 2× wager','Alliance · wager returned','Alliance · 2× wager','Faithful · +Alliance','Faithful · +Alliance']),mfPick:null,mfChoice:'',mfResolved:false,wheel:[],rot:0,spinBusy:false,murderMode:null,murderVictim:'',fateDeck:shuffle(['DAGGER','POISON','ROPE','WRENCH','SAFE','SAFE','SAFE','SAFE','SAFE']),fate:[],murders:0,safes:0,lastWeapon:'',lives:3};shell.className='shell';closeFull();render()}
function tabsHtml(){tabs.innerHTML=views.map((v,i)=>`<button class="${i===current?'active':''}" data-tab="${i}">${v}</button>`).join('');tabs.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{current=+b.dataset.tab;reset()})}
function showFull(html,cls=''){panel.innerHTML=html;full.className='full show '+cls;panel.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>{closeFull();current=Math.min(views.length-1,current+1);reset()})}
function closeFull(){full.className='full';panel.innerHTML=''}
function maskedEntry(title,desc){return `<section class="card"><div class="masked-entry"><div class="masked-row"><div class="mask"></div><div class="mask center"></div><div class="mask"></div></div><div class="envelope">TAKE THE OFFER</div></div><div class="eyebrow">THE MASKED HALL</div><h2 class="big">${title}</h2><p class="small">${desc}</p></section>`}
function regularHost(){return `<section class="card"><div class="eyebrow">REGULAR HOST · APPROVED</div><h2 class="big">The Host decides now.</h2><p class="small">Choose your move and predict the Host. Result is immediate.</p><div class="status">YOUR MOVE</div><div class="choices"><button class="btn ${s.hostOwn==='COOPERATE'?'selected':''}" data-ho="COOPERATE">COOPERATE</button><button class="btn ${s.hostOwn==='BETRAY'?'selected':''}" data-ho="BETRAY">BETRAY</button></div><div class="status">PREDICT THE HOST</div><div class="choices"><button class="btn ${s.hostGuess==='COOPERATE'?'selected':''}" data-hg="COOPERATE">COOPERATE</button><button class="btn ${s.hostGuess==='BETRAY'?'selected':''}" data-hg="BETRAY">BETRAY</button></div><button class="btn primary" id="hostPlay" style="width:100%;margin-top:9px" ${s.hostOwn&&s.hostGuess?'':'disabled'}>PLAY NOW</button></section>`}
function maskedHost(){if(!s.mhPicks.length)return maskedEntry('The Host has made you an offer.','Six hidden Host cards. You get three picks. Match two rewards to win it.');let done=s.mhResolved;return `<section class="card"><div class="eyebrow">MASKED HOST</div><h2 class="big">Find a matching reward</h2><p class="small">Third pick reveals every card. Unpicked cards fade so your three choices stay obvious.</p><div class="count">${done?'ALL CARDS REVEALED':(3-s.mhPicks.length)+' PICKS LEFT'}</div>${!done?`<div class="status">${remarks.host[Math.max(0,s.mhPicks.length-1)]}</div>`:''}<div class="grid6">${s.mhDeck.map((ri,i)=>{let picked=s.mhPicks.includes(i),open=picked||done,r=hostRewards[ri];return `<button class="tile ${open?'revealed':''} ${done&&!picked?'faded':''}" data-mh="${i}" ${done||picked?'disabled':''}>${open?`${r.k}<span class="reward-note">${r.d}</span>`:'HOST'}</button>`}).join('')}</div></section>`}
function maskedFaithful(){if(s.mfPick===null)return maskedEntry('Pick a Card','Your wager is committed. Choose one of six hidden TV contestants.');let chosen=s.mfDeck[s.mfPick];return `<section class="card"><div class="eyebrow">MASKED FAITHFUL</div><h2 class="big">Pick a Card</h2><p class="small">Your selected contestant stays highlighted. The remaining contestants are revealed, grayscale and faded.</p><div class="grid6">${s.mfDeck.map((v,i)=>`<button class="tile ${i===s.mfPick?'revealed':'faded'}" disabled>${v}</button>`).join('')}</div>${!s.mfResolved?`<div class="status">COOPERATE OR BETRAY</div><div class="choices"><button class="btn ${s.mfChoice==='COOPERATE'?'selected':''}" data-mfc="COOPERATE">COOPERATE</button><button class="btn ${s.mfChoice==='BETRAY'?'selected':''}" data-mfc="BETRAY">BETRAY</button></div><button class="btn primary" id="mfPlay" style="width:100%;margin-top:9px" ${s.mfChoice?'':'disabled'}>PLAY NOW</button>`:''}</section>`}
const wheelItems=['DAGGER','MURDER KEY','MURDERER CARD','POISON','ROPE','WRENCH','CANDLESTICK','TOASTER'];
function wheelLabels(){return wheelItems.map((x,i)=>`<span style="transform:rotate(${i*45}deg) translate(0,-116px) rotate(${-i*45}deg)">${x}</span>`).join('')}
function wheel(){return maskedEntry('The Murderer waits.','Three spins. Match symbols to improve your secret murder.')+`<section class="card"><div class="eyebrow">MURDERER WHEEL</div><h2 class="big">What can you win?</h2><div class="benefits"><div class="benefit"><strong>STANDARD MURDER</strong><div class="small">No match required. Secretly remove one eligible Castle life.</div></div><div class="benefit"><strong>WEAPON MATCH</strong><div class="small">Enhanced murder reward in the final ruleset.</div></div><div class="benefit"><strong>MURDER KEY MATCH</strong><div class="small">Unlocks the strongest murder-option tier in this proof.</div></div><div class="benefit"><strong>MURDERER CARD MATCH</strong><div class="small">Unlocks a special murderer advantage. Exact live benefit remains Director-controlled.</div></div></div><div class="wheel-wrap"><div class="pointer"></div><div class="wheel" id="wheel" style="transform:rotate(${s.rot}deg);transition-duration:${s.spinBusy?s.spinDuration||2.5:0}s;transition-timing-function:${s.spinEase||'ease-out'}">${wheelLabels()}</div></div><div class="status">${s.wheel.length?remarks.wheel[Math.min(s.wheel.length-1,2)]:'Spin when ready.'}</div><button class="btn primary" id="spin" style="width:100%;margin-top:8px" ${s.spinBusy||s.wheel.length>=3?'disabled':''}>${s.wheel.length>=3?'SPINS COMPLETE':'SPIN '+(s.wheel.length+1)}</button><div class="spins">${[0,1,2].map(i=>`<div class="spin-slot">${s.wheel[i]||'—'}</div>`).join('')}</div><div id="murderBenefit"></div></section>`}
function murderTargets(){return `<section class="card"><div class="eyebrow">CHOOSE YOUR VICTIM</div><h2 class="big">${pick(remarks.murder)}</h2><p class="small">Your murder choice remains secret until the end of the game.</p><div class="players">${users.map(u=>`<div class="player"><div><strong>${u[0]}</strong><div class="player-meta">Lives ${u[1]} · Score ${u[2]} · Place #${u[3]}</div></div><button class="btn ${s.murderVictim===u[0]?'blood':''}" data-victim="${u[0]}">${s.murderVictim===u[0]?'SELECTED':'MURDER'}</button></div>`).join('')}</div><button class="btn primary" id="confirmMurder" style="width:100%;margin-top:8px" ${s.murderVictim?'':'disabled'}>SEAL THE MURDER</button></section>`}
function fate(){let done=s.murders>=3||s.safes>=3;return `<section class="card"><div class="eyebrow">TRAITOR · FATE</div><h2 class="big">Choose an envelope</h2><p class="small">Every Fate encounter reshuffles all nine cards. First to 3 Murder or 3 Safe ends Fate.</p><div class="fate-grid">${s.fateDeck.map((v,i)=>{let open=s.fate.includes(i)||done,fade=done&&!s.fate.includes(i);return `<button class="fate-card ${fade?'faded':''}" data-fate="${i}" ${open?'disabled':''}>${open?v:'SEALED'}</button>`}).join('')}</div><div class="status">MURDER ${s.murders}/3 · SAFE ${s.safes}/3</div></section>`}
function render(){tabsHtml();stage.innerHTML=current===0?regularHost():current===1?maskedHost():current===2?maskedFaithful():current===3?(s.murderMode==='targets'?murderTargets():wheel()):fate();wire()}
function wire(){
stage.querySelectorAll('[data-ho]').forEach(b=>b.onclick=()=>{s.hostOwn=b.dataset.ho;render()});stage.querySelectorAll('[data-hg]').forEach(b=>b.onclick=()=>{s.hostGuess=b.dataset.hg;render()});let hp=$('hostPlay');if(hp)hp.onclick=()=>{let right=s.hostGuess===s.hostAnswer;showFull(`<div class="eyebrow">HOST RESULT</div><h2>${right?'YOU READ THE HOST':'THE HOST READ YOU'}</h2><p class="small">Host chose <strong>${s.hostAnswer}</strong>. ${right?'Correct — immediate Host scoring/protection applies.':'Wrong — no Host reward.'}</p><button class="btn primary" data-next style="width:100%;margin-top:14px">NEXT ENCOUNTER</button>`)};
stage.querySelectorAll('[data-mh]').forEach(b=>b.onclick=()=>{let i=+b.dataset.mh;if(s.mhResolved||s.mhPicks.includes(i))return;s.mhPicks.push(i);if(s.mhPicks.length===3){let vals=s.mhPicks.map(x=>s.mhDeck[x]),match=vals.find((x,n)=>vals.indexOf(x)!==n);s.mhResolved=true;s.mhReward=match===undefined?null:hostRewards[match];render();later(()=>{let r=s.mhReward;showFull(`<div class="eyebrow">MASKED HOST RESULT</div><h2>${r?r.k:'NO MATCH'}</h2><p class="small">${r?r.d:'Your wager is returned. No Host reward this time.'}</p>${r&&r.k==='LIFE SHIELD'?'<div class="status">LIFE SHIELD ADDED BESIDE LIVES / BANISH</div>':''}<button class="btn primary" data-next style="width:100%;margin-top:14px">NEXT ENCOUNTER</button>`);later(()=>{let n=panel.querySelector('[data-next]');if(n)n.click()},5000)},6500)}else render()});
if(current===2&&s.mfPick===null)stage.querySelectorAll('.tile').forEach((b,i)=>b.onclick=()=>{s.mfPick=i;render()});stage.querySelectorAll('[data-mfc]').forEach(b=>b.onclick=()=>{s.mfChoice=b.dataset.mfc;render()});let mp=$('mfPlay');if(mp)mp.onclick=()=>{let reward=s.mfDeck[s.mfPick],good=Math.random()<.85,amount=reward.includes('3×')?120:reward.includes('2×')?80:reward.includes('returned')?40:60;s.mfResolved=true;if(good&&reward.includes('+Alliance'))showFull(`<div class="eyebrow">MASKED FAITHFUL RESULT</div><h2>WELCOME TO THE CASTLE 5 ALLIANCE</h2><div class="portrait">TV</div><p class="small">New alliance member added. Bonus earned: <strong>${amount} pts</strong>.</p><button class="btn primary" data-next style="width:100%;margin-top:14px">NEXT ENCOUNTER</button>`);else showFull(`<div class="eyebrow">MASKED FAITHFUL RESULT</div><h2>${good?'YOU GOT IT RIGHT':'NOT THIS TIME'}</h2><p class="small">${good?`Reward: <strong>${reward}</strong><br>Amount earned: <strong>${amount} pts</strong>.`:'Wrong prediction — wager lost. No additional penalty.'}</p><button class="btn primary" data-next style="width:100%;margin-top:14px">NEXT ENCOUNTER</button>`)};
let spin=$('spin');if(spin)spin.onclick=()=>{if(s.spinBusy||s.wheel.length>=3)return;s.spinBusy=true;let stopType=pick(['FAST STOP','SLOW STOP','RANDOM STOP']),dur=stopType==='FAST STOP'?1.4:stopType==='SLOW STOP'?4.1:(1.8+Math.random()*2.2);s.spinDuration=dur;s.spinEase=stopType==='FAST STOP'?'cubic-bezier(.2,.7,.2,1)':stopType==='SLOW STOP'?'cubic-bezier(.08,.65,.08,1)':'cubic-bezier(.13,.72,.11,1)';let idx=Math.floor(Math.random()*wheelItems.length),symbol=wheelItems[idx];s.rot+=1080+Math.floor(Math.random()*720)+idx*45;render();later(()=>{s.wheel.push(symbol);s.spinBusy=false;render();if(s.wheel.length===3){later(()=>{let counts={};s.wheel.forEach(x=>counts[x]=(counts[x]||0)+1);let match=Object.keys(counts).find(x=>counts[x]>=2);s.murderMode=match||'STANDARD MURDER';render();let box=$('murderBenefit');if(box)box.innerHTML=`<div class="status">POP: LET'S MURDER SOMEONE...</div><div class="benefit"><strong>${s.murderMode}</strong><div class="small">Select this murder benefit to continue.</div><button class="btn primary" id="chooseBenefit" style="width:100%;margin-top:7px">USE ${s.murderMode}</button></div>`;let cb=$('chooseBenefit');if(cb)cb.onclick=()=>{s.murderMode='targets';render()}},5000)}},dur*1000)};
stage.querySelectorAll('[data-victim]').forEach(b=>b.onclick=()=>{s.murderVictim=b.dataset.victim;render()});let cm=$('confirmMurder');if(cm)cm.onclick=()=>showFull(`<div class="eyebrow">SECRET MURDER SEALED</div><h2>YOU MURDERER — YOU KILLED IT!</h2><p class="small"><strong>${s.murderVictim}</strong> was selected. Your identity stays secret until the end of the game.</p><p class="small">Keep it a secret, or show your murderous side — it's up to you.</p><button class="btn primary" data-next style="width:100%;margin-top:14px">NEXT ENCOUNTER</button>`,'murder');
stage.querySelectorAll('[data-fate]').forEach(b=>b.onclick=()=>{let i=+b.dataset.fate;if(s.fate.includes(i)||s.murders>=3||s.safes>=3)return;s.fate.push(i);let v=s.fateDeck[i];if(v==='SAFE')s.safes++;else{s.murders++;s.lastWeapon=v}render();if(s.safes>=3)later(()=>showFull(`<div class="eyebrow">FATE RESULT</div><h2>SAFE</h2><p class="small">You survived Fate. All unselected cards have been revealed and faded.</p><p class="status">Lives remaining: ${s.lives}</p><button class="btn primary" data-next style="width:100%;margin-top:14px">NEXT ENCOUNTER</button>`),1200);if(s.murders>=3){s.lives=Math.max(0,s.lives-1);later(()=>showFull(`<div class="eyebrow">FATE RESULT</div><h2>DEATH BY ${s.lastWeapon}</h2><p class="small">An active TV Traitor carried out the murder: <strong>${pick(['Traitor A','Traitor B','Traitor C'])}</strong>.</p><p class="status">Lives remaining: ${s.lives}</p><button class="btn primary" data-next style="width:100%;margin-top:14px">NEXT ENCOUNTER</button>`,'murder'),900)}})
}
reset();
})();
</script></body></html>

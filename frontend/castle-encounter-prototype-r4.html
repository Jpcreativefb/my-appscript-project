<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Castle Encounter Prototype R4 · Real Assets R1</title>
<style>
:root{--gold:#c8aa6a;--cream:#f6f0e4;--muted:#b8b0a1;--panel:rgba(7,7,7,.84);--line:rgba(200,170,106,.34);--red:#8d1118}
*{box-sizing:border-box;min-width:0}html,body{margin:0;background:#050505;color:var(--cream);font-family:Georgia,"Times New Roman",serif;overflow-x:hidden}button{font:inherit;max-width:100%}.shell{min-height:100vh;background:#050505 center/cover fixed no-repeat;padding:12px 9px 28px;position:relative}.shell:before{content:'';position:fixed;inset:0;background:linear-gradient(rgba(0,0,0,.28),rgba(0,0,0,.88));pointer-events:none}.phone{width:100%;max-width:430px;margin:auto;position:relative;z-index:1;overflow:hidden}.eyebrow{font:700 10px Arial,sans-serif;letter-spacing:.15em;color:#d7c391;text-transform:uppercase}.title{font-size:27px;margin:4px 0}.small{font:12px/1.45 Arial,sans-serif;color:#d8d2c6}.tabs{display:flex;gap:5px;overflow-x:auto;padding-bottom:5px;margin:9px 0}.tabs button{flex:0 0 auto;white-space:nowrap;border:1px solid #5b513b;background:#101010;color:#ddd;padding:8px 9px;border-radius:2px}.tabs button.active{background:#d5cab0;color:#17130c}.card{width:100%;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(4px);padding:12px;margin-bottom:10px;border-radius:2px;overflow:hidden}.big{font-size:22px;margin:4px 0 7px}.btn{min-height:44px;border:1px solid #9e8b61;background:#131313;color:var(--cream);padding:9px;border-radius:2px}.btn.primary,.btn.selected{background:#d5cab0;color:#18140c;font-weight:800}.btn.blood{background:#7f0e14;border-color:#ba4b50;color:#fff}.btn:disabled{opacity:.38}.choices{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:7px}.status{font:700 12px/1.4 Arial,sans-serif;color:#ece0bd;margin-top:8px}.count{font:800 17px Arial,sans-serif;color:#e1d4ae;text-align:center;margin:8px 0}.asset-stage{position:relative;height:230px;border:1px solid rgba(255,255,255,.14);overflow:hidden;margin-bottom:10px;background:rgba(0,0,0,.25)}.asset-stage>img.room-prop{position:absolute;inset:auto 50% 10px auto;transform:translateX(50%);max-width:78%;max-height:74%;object-fit:contain;filter:drop-shadow(0 8px 16px rgba(0,0,0,.45))}.asset-stage.masked>img.room-prop{max-height:86%;bottom:2px}.offer-prop{position:absolute;right:9px;bottom:9px;width:94px;max-height:72px;object-fit:contain;filter:drop-shadow(0 4px 8px #000)}.live-label{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.72);padding:5px 7px;font:700 9px Arial,sans-serif;letter-spacing:.12em}.portrait-stack,.castle-encounter-portrait-stack{width:min(72vw,260px);margin:8px auto 12px;text-align:center}.portrait-media,.castle-encounter-portrait-stack__media{position:relative;aspect-ratio:320/420;overflow:hidden}.portrait-source,.castle-encounter-portrait-stack__portrait{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:linear-gradient(160deg,#242424,#0e0e0e)}.portrait-source.empty,.castle-encounter-portrait-stack__portrait--empty{display:grid;place-items:center;padding:30px;color:#aaa;font:700 10px/1.4 Arial,sans-serif;text-align:center}.portrait-overlay,.castle-encounter-portrait-stack__overlay{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}.portrait-caption,.castle-encounter-portrait-stack__caption{display:block;margin-top:4px}.portrait-caption strong,.castle-encounter-portrait-stack__caption strong{display:block;font-size:17px}.portrait-caption span,.castle-encounter-portrait-stack__caption span{display:block;font:10px/1.3 Arial,sans-serif;color:#cec8bd}.grid6,.fate-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.tile,.fate-card{width:100%;min-height:112px;border:1px solid #62583f;background:#111;color:var(--cream);padding:5px;text-align:center;border-radius:2px;overflow:hidden;font-size:10px;position:relative}.tile.revealed{outline:2px solid #b9aa82}.tile.faded,.fate-card.faded{filter:grayscale(1);opacity:.28}.tile img,.fate-card img{width:100%;height:72px;object-fit:contain;display:block;margin:auto}.reward-note{display:block;font:9px/1.2 Arial,sans-serif;color:#cec3ad;margin-top:4px}.full{position:fixed;inset:0;z-index:60;background:radial-gradient(circle at 50% 35%,#251715,#050505 70%);display:none;place-items:center;padding:18px;text-align:center;overflow:auto}.full.show{display:grid}.full.murder{background:radial-gradient(circle,#6d090d 0,#240406 48%,#020000 100%)}.panel{width:100%;max-width:430px}.panel h2{font-size:34px;margin:7px 0}.result-prop{width:min(62vw,220px);max-height:210px;object-fit:contain;margin:4px auto 8px;display:block}.wheel-wrap{display:grid;place-items:center;margin:8px 0;max-width:100%;overflow:hidden}.pointer{width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:22px solid #d5cab0;margin-bottom:-6px;z-index:2}.wheel{width:min(74vw,276px);height:min(74vw,276px);border-radius:50%;border:6px solid #4b4434;position:relative;background:conic-gradient(#54171a 0 45deg,#1d1d1d 45deg 90deg,#594b2c 90deg 135deg,#292929 135deg 180deg,#54171a 180deg 225deg,#1d1d1d 225deg 270deg,#594b2c 270deg 315deg,#292929 315deg 360deg);transition-property:transform;transform-origin:center}.wheel span{position:absolute;left:50%;top:50%;width:76px;margin-left:-38px;text-align:center;font:700 8px/1 Arial,sans-serif;transform-origin:38px 0}.wheel:after{content:'MURDER';position:absolute;inset:36%;border-radius:50%;background:#070707;border:1px solid #8f8060;display:grid;place-items:center;font:800 9px Arial,sans-serif;letter-spacing:.08em}.wheel-art{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin:8px 0}.wheel-token{min-height:68px;border:1px solid #484339;background:#0d0d0d;padding:5px;text-align:center;font:8px/1.2 Arial,sans-serif;display:grid;place-items:center}.wheel-token img{max-width:100%;height:48px;object-fit:contain}.wheel-token.pending{border-style:dashed;color:#aaa}.spins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.spin-slot{min-height:58px;border:1px solid #534b39;background:#111;padding:6px;text-align:center;font:11px Arial,sans-serif}.benefits{display:grid;gap:7px;margin-top:9px}.benefit{border:1px solid #504a3d;background:#111;padding:9px;text-align:left}.players{display:grid;gap:6px;margin-top:9px}.player{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:7px;align-items:center;border:1px solid #484237;background:#101010;padding:7px;font:11px Arial,sans-serif}.mini-portrait{width:58px;height:76px;position:relative;overflow:hidden}.mini-portrait .portrait-source,.mini-portrait .portrait-overlay{position:absolute}.player-meta{font-size:10px;color:#cfc8bb}.pending-art{border:1px dashed #666;background:#0d0d0d;padding:7px;color:#aaa;font:9px/1.3 Arial,sans-serif;text-align:center}.flow-strip{font:10px/1.4 Arial,sans-serif;color:#ded7ca;border-left:2px solid #80745b;padding-left:8px;margin:7px 0 10px}
@media(max-width:390px){.shell{padding-left:7px;padding-right:7px}.card{padding:10px}.asset-stage{height:215px}.portrait-stack,.castle-encounter-portrait-stack{width:min(70vw,248px)}.wheel{width:min(72vw,270px);height:min(72vw,270px)}.player{grid-template-columns:52px minmax(0,1fr) auto}.mini-portrait{width:52px;height:70px}}
@media(max-width:360px){.grid6,.fate-grid{gap:4px}.tile,.fate-card{font-size:9px;padding:3px;min-height:102px}.tile img,.fate-card img{height:64px}.asset-stage{height:202px}.panel h2{font-size:30px}.choices{grid-template-columns:1fr}.wheel{width:min(76vw,252px);height:min(76vw,252px)}.wheel span{font-size:7px}.player{grid-template-columns:46px minmax(0,1fr)}.mini-portrait{width:46px;height:64px}.player .btn{grid-column:1/-1;width:100%}.wheel-art{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body>
<div class="shell" id="shell"><div class="phone"><div class="eyebrow">PATTC CASTLE · REAL-ASSET INTEGRATION R1</div><h1 class="title">Encounter Lab</h1><p class="small">Approved rooms, overlays and available physical props are layered over the accepted R4 interaction proof.</p><div class="flow-strip">MASKED HALL → wager/envelope acceptance → masked identity reveal → Host / Faithful / Murderer / Traitor-Fate</div><div class="tabs" id="tabs"></div><main id="stage"></main></div></div>
<div class="full" id="full"><div class="panel" id="panel"></div></div>
<script src="./js/pages/castleEncounterAssetHooksR1.js"></script>
<script>
(function(){
const H=window.CASTLE_ENCOUNTER_REAL_ASSET_HOOKS_R1;
const views=['Regular Host','Masked Host','Masked Faithful','Murderer Wheel','Traitor Fate'];let current=0,s={},timers=[];const $=id=>document.getElementById(id),stage=$('stage'),tabs=$('tabs'),full=$('full'),panel=$('panel'),shell=$('shell');
const qs=new URLSearchParams(location.search),portraitUrl=qs.get('portrait')||'',hostPortraitUrl=qs.get('hostPortrait')||'';
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};const pick=a=>a[Math.floor(Math.random()*a.length)];
const hostRewards=[{k:'LIFE SHIELD',d:'Blocks one eligible murder attempt. It appears beside Lives / Banish until used.',asset:H.props.HOST_PROTECTION},{k:'BIG BONUS',d:'Adds the Host bonus to your Castle score immediately.',asset:H.props.HOST_BONUS},{k:'BANISH REDUCTION',d:'Removes one current Banish pressure when earned.',asset:H.props.HOST_MERCY}];
const remarks={host:['One down. The masks are judging you.','Two choices made. Feeling lucky?','Last pick. Try not to waste it.'],wheel:['Round and round. Someone should be nervous.','That was almost useful. Spin again.','Last chance — you better get something!'],murder:['Go ahead, you little devil — choose your victim.','Someone is about to have a very bad Castle night.','Keep it secret or show your murderous side. Your choice.']};
const users=[['Art',3,740,1],['Maria',2,690,2],['Chris',3,620,3],['Jordan',1,590,4],['Sam',2,530,5]];
const wheelItems=['DAGGER','MURDER KEY','MURDERER CARD','POISON','ROPE','WRENCH','CANDLESTICK','TOASTER'];
const wheelArt={'MURDERER CARD':H.props.MURDERER_CARD};
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function clearTimers(){timers.forEach(clearTimeout);timers=[]}function later(fn,ms){let t=setTimeout(fn,ms);timers.push(t);return t}
function room(key){shell.style.backgroundImage=`url('${H.rooms[key]}')`}
function portrait(name,status,overlay,image,pending){return `<figure class="portrait-stack"><div class="portrait-media">${image?`<img class="portrait-source" src="${esc(image)}" alt="${esc(name)}">`:`<div class="portrait-source empty"><span>${esc(pending||'DYNAMIC PORTRAIT SOURCE')}</span></div>`}<img class="portrait-overlay" src="${overlay}" alt=""></div><figcaption class="portrait-caption"><strong>${esc(name)}</strong><span>${esc(status)}</span></figcaption></figure>`}
function maskedEntry(title,desc){room('MASKED_HALL');return `<section class="card"><div class="asset-stage masked"><div class="live-label">MASKED HALL</div><img class="room-prop" src="${H.props.MASKED_HALL_MASK}" alt="Masked Hall mask"><img class="offer-prop" src="${H.props.MASKED_OFFER}" alt="Sealed wager envelope"></div><div class="eyebrow">THE MASKED HALL</div><h2 class="big">${title}</h2><p class="small">${desc}</p><div class="status">WAGER / ENVELOPE ACCEPTANCE → IDENTITY REVEAL</div></section>`}
function reset(){clearTimers();s={hostOwn:'',hostGuess:'',hostAnswer:pick(['COOPERATE','BETRAY']),mhDeck:shuffle([0,0,1,1,2,2]),mhPicks:[],mhResolved:false,mhReward:null,mfDeck:shuffle(['Alliance · 3× wager','Alliance · 2× wager','Alliance · wager returned','Alliance · 2× wager','Faithful · +Alliance','Faithful · +Alliance']),mfPick:null,mfChoice:'',mfResolved:false,wheel:[],rot:0,spinBusy:false,murderMode:null,murderVictim:'',fateDeck:shuffle(['DAGGER','POISON','ROPE','WRENCH','SAFE','SAFE','SAFE','SAFE','SAFE']),fate:[],murders:0,safes:0,lastWeapon:'',lives:3};closeFull();render()}
function tabsHtml(){tabs.innerHTML=views.map((v,i)=>`<button class="${i===current?'active':''}" data-tab="${i}">${v}</button>`).join('');tabs.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{current=+b.dataset.tab;reset()})}
function showFull(html,cls=''){panel.innerHTML=html;full.className='full show '+cls;panel.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>{closeFull();current=Math.min(views.length-1,current+1);reset()})}
function closeFull(){full.className='full';panel.innerHTML=''}
function hostPortrait(status){return portrait('THE HOST',status,H.overlays.HOST,hostPortraitUrl,'HOST PORTRAIT SOURCE PENDING · NEVER SUBSTITUTE A TV CONTESTANT')}
function regularHost(){room('REGULAR_HOST');return `<section class="card"><div class="eyebrow">REGULAR HOST</div>${hostPortrait('HOST ENCOUNTER')}<h2 class="big">The Host decides now.</h2><p class="small">Choose your move and predict the Host. Result is immediate.</p><div class="status">YOUR MOVE</div><div class="choices"><button class="btn ${s.hostOwn==='COOPERATE'?'selected':''}" data-ho="COOPERATE">COOPERATE</button><button class="btn ${s.hostOwn==='BETRAY'?'selected':''}" data-ho="BETRAY">BETRAY</button></div><div class="status">PREDICT THE HOST</div><div class="choices"><button class="btn ${s.hostGuess==='COOPERATE'?'selected':''}" data-hg="COOPERATE">COOPERATE</button><button class="btn ${s.hostGuess==='BETRAY'?'selected':''}" data-hg="BETRAY">BETRAY</button></div><button class="btn primary" id="hostPlay" style="width:100%;margin-top:9px" ${s.hostOwn&&s.hostGuess?'':'disabled'}>PLAY NOW</button></section>`}
function maskedHost(){if(!s.mhPicks.length)return maskedEntry('The Host has made you an offer.','Accept the sealed wager, reveal the Masked Host, then choose three of six hidden Host cards.');room('MASKED_HOST');let done=s.mhResolved;return `<section class="card"><div class="eyebrow">MASKED IDENTITY REVEAL · HOST</div>${hostPortrait('MASKED HOST')}<h2 class="big">Find a matching reward</h2><p class="small">Three picks. Match two rewards to win it. No match returns the wager.</p><div class="count">${done?'ALL CARDS REVEALED':(3-s.mhPicks.length)+' PICKS LEFT'}</div>${!done?`<div class="status">${remarks.host[Math.max(0,s.mhPicks.length-1)]}</div>`:''}<div class="grid6">${s.mhDeck.map((ri,i)=>{let picked=s.mhPicks.includes(i),open=picked||done,r=hostRewards[ri];return `<button class="tile ${open?'revealed':''} ${done&&!picked?'faded':''}" data-mh="${i}" ${done||picked?'disabled':''}>${open?`<img src="${r.asset}" alt=""><strong>${r.k}</strong><span class="reward-note">${r.d}</span>`:`<img src="${H.props.MASKED_OFFER}" alt=""><strong>HOST</strong>`}</button>`}).join('')}</div></section>`}
function maskedFaithful(){if(s.mfPick===null)return maskedEntry('Pick a Card','Accept the wager, reveal Masked Faithful, then choose one of six hidden TV contestant cards.');room('MASKED_FAITHFUL');return `<section class="card"><div class="eyebrow">MASKED IDENTITY REVEAL · FAITHFUL</div>${portrait('TV CONTESTANT','MASKED FAITHFUL',H.overlays.CASTLE_FIVE,portraitUrl,'DYNAMIC TV CONTESTANT PORTRAIT')}<h2 class="big">Pick a Card</h2><p class="small">The same contestant portrait source is reused; Castle state comes from the overlay and live labels.</p><div class="grid6">${s.mfDeck.map((v,i)=>`<button class="tile ${i===s.mfPick?'revealed':'faded'}" disabled>${portrait('CONTESTANT '+(i+1),v,H.overlays.CASTLE_FIVE,portraitUrl,'TV CONTESTANT')}</button>`).join('')}</div>${!s.mfResolved?`<div class="status">COOPERATE OR BETRAY</div><div class="choices"><button class="btn ${s.mfChoice==='COOPERATE'?'selected':''}" data-mfc="COOPERATE">COOPERATE</button><button class="btn ${s.mfChoice==='BETRAY'?'selected':''}" data-mfc="BETRAY">BETRAY</button></div><button class="btn primary" id="mfPlay" style="width:100%;margin-top:9px" ${s.mfChoice?'':'disabled'}>PLAY NOW</button>`:''}</section>`}
function wheelLabels(){return wheelItems.map((x,i)=>`<span style="transform:rotate(${i*45}deg) translate(0,-112px) rotate(${-i*45}deg)">${x}</span>`).join('')}
function wheelTokens(){let all=wheelItems.concat(['TECHNOLOGY · MOBILE PHONE']);return all.map(x=>{let a=wheelArt[x];return a?`<div class="wheel-token"><img src="${a}" alt=""><strong>${x}</strong></div>`:`<div class="wheel-token pending"><span>${x}<br>APPROVED ITEM · PRODUCTION ART PENDING</span></div>`}).join('')}
function wheel(){if(!s.wheel.length){let entry=maskedEntry('The Murderer waits.','Accept the wager and reveal Masked Murderer. Three spins follow.');room('MASKED_MURDERER');return entry+wheelBody()}room('MASKED_MURDERER');return wheelBody()}
function wheelBody(){return `<section class="card"><div class="eyebrow">MASKED IDENTITY REVEAL · MURDERER</div>${portrait('MASKED MURDERER','MURDER DANGER',H.overlays.MURDER_DANGER,portraitUrl,'DYNAMIC MASKED PORTRAIT')}<h2 class="big">Murder Wheel</h2><p class="small">The accepted eight R4 wheel outcomes remain unchanged. Technology is shown only as a pending-art presentation slot and is not selectable.</p><div class="wheel-art">${wheelTokens()}</div><div class="wheel-wrap"><div class="pointer"></div><div class="wheel" id="wheel" style="transform:rotate(${s.rot}deg);transition-duration:${s.spinBusy?s.spinDuration||2.5:0}s;transition-timing-function:${s.spinEase||'ease-out'}">${wheelLabels()}</div></div><div class="status">${s.wheel.length?remarks.wheel[Math.min(s.wheel.length-1,2)]:'Spin when ready.'}</div><button class="btn primary" id="spin" style="width:100%;margin-top:8px" ${s.spinBusy||s.wheel.length>=3?'disabled':''}>${s.wheel.length>=3?'SPINS COMPLETE':'SPIN '+(s.wheel.length+1)}</button><div class="spins">${[0,1,2].map(i=>`<div class="spin-slot">${s.wheel[i]||'—'}</div>`).join('')}</div><div id="murderBenefit"></div></section>`}
function miniPortrait(name){return `<div class="mini-portrait">${portrait(name,'PATTC PLAYER',H.overlays.MURDER_DANGER,portraitUrl,'PATTC').replace('<figure class="portrait-stack">','').replace('</figure>','')}</div>`}
function murderTargets(){room('MURDER_TARGET');return `<section class="card"><div class="eyebrow">PATTC MURDER TARGET</div><h2 class="big">${pick(remarks.murder)}</h2><p class="small">Eligible PATTC portraits stay unchanged underneath the approved Murder Danger overlay. Your murder choice remains secret until the end.</p><div class="players">${users.map(u=>`<div class="player">${miniPortrait(u[0])}<div><strong>${u[0]}</strong><div class="player-meta">Lives ${u[1]} · Score ${u[2]} · Place #${u[3]}</div></div><button class="btn ${s.murderVictim===u[0]?'blood':''}" data-victim="${u[0]}">${s.murderVictim===u[0]?'SELECTED':'MURDER'}</button></div>`).join('')}</div><button class="btn primary" id="confirmMurder" style="width:100%;margin-top:8px" ${s.murderVictim?'':'disabled'}>SEAL THE MURDER</button></section>`}
function fate(){room('MASKED_TRAITOR_FATE');let done=s.murders>=3||s.safes>=3;return `<section class="card"><div class="eyebrow">MASKED IDENTITY REVEAL · TRAITOR / FATE</div>${portrait('MASKED TRAITOR','HIDDEN TRAITOR',H.overlays.HIDDEN_TRAITOR,portraitUrl,'DYNAMIC TV CONTESTANT PORTRAIT')}<h2 class="big">Choose an envelope</h2><p class="small">Every Fate encounter reshuffles the accepted nine-card deck. First to 3 Murder or 3 Safe ends Fate.</p><div class="fate-grid">${s.fateDeck.map((v,i)=>{let open=s.fate.includes(i)||done,fade=done&&!s.fate.includes(i),asset=!open?H.props.FATE_SEALED:(v==='SAFE'?H.props.FATE_SAFE:H.props.FATE_MURDERED);return `<button class="fate-card ${fade?'faded':''}" data-fate="${i}" ${open?'disabled':''}><img src="${asset}" alt=""><strong>${open?v:'SEALED'}</strong></button>`}).join('')}</div><div class="status">MURDER ${s.murders}/3 · SAFE ${s.safes}/3</div></section>`}
function render(){tabsHtml();stage.innerHTML=current===0?regularHost():current===1?maskedHost():current===2?maskedFaithful():current===3?(s.murderMode==='targets'?murderTargets():wheel()):fate();wire()}
function wire(){
stage.querySelectorAll('[data-ho]').forEach(b=>b.onclick=()=>{s.hostOwn=b.dataset.ho;render()});stage.querySelectorAll('[data-hg]').forEach(b=>b.onclick=()=>{s.hostGuess=b.dataset.hg;render()});let hp=$('hostPlay');if(hp)hp.onclick=()=>{let right=s.hostGuess===s.hostAnswer;showFull(`${hostPortrait('HOST RESULT')}<div class="eyebrow">HOST RESULT</div><h2>${right?'YOU READ THE HOST':'THE HOST READ YOU'}</h2><p class="small">Host chose <strong>${s.hostAnswer}</strong>. ${right?'Correct — immediate Host scoring/protection applies.':'Wrong — no Host reward.'}</p><button class="btn primary" data-next style="width:100%;margin-top:14px">NEXT ENCOUNTER</button>`)};
stage.querySelectorAll('[data-mh]').forEach(b=>b.onclick=()=>{let i=+b.dataset.mh;if(s.mhResolved||s.mhPicks.includes(i))return;s.mhPicks.push(i);if(s.mhPicks.length===3){let vals=s.mhPicks.map(x=>s.mhDeck[x]),match=vals.find((x,n)=>vals.indexOf(x)!==n);s.mhResolved=true;s.mhReward=match===undefined?null:hostRewards[match];render();later(()=>{let r=s.mhReward;showFull(`${hostPortrait('MASKED HOST RESULT')}${r?`<img class="result-prop" src="${r.asset}" alt="">`:''}<div class="eyebrow">MASKED HOST RESULT</div><h2>${r?r.k:'NO MATCH'}</h2><p class="small">${r?r.d:'Your wager is returned. No Host reward this time.'}</p>${r&&r.k==='LIFE SHIELD'?'<div class="status">LIFE SHIELD ADDED BESIDE LIVES / BANISH</div>':''}<button class="btn primary" data-next style="width:100%;margin-top:14px">NEXT ENCOUNTER</button>`);later(()=>{let n=panel.querySelector('[data-next]');if(n)n.click()},5000)},6500)}else render()});
if(current===2&&s.mfPick===null)stage.querySelectorAll('.tile').forEach((b,i)=>b.onclick=()=>{s.mfPick=i;render()});stage.querySelectorAll('[data-mfc]').forEach(b=>b.onclick=()=>{s.mfChoice=b.dataset.mfc;render()});let mp=$('mfPlay');if(mp)mp.onclick=()=>{let reward=s.mfDeck[s.mfPick],good=Math.random()<.85,amount=reward.includes('3×')?120:reward.includes('2×')?80:reward.includes('returned')?40:60;s.mfResolved=true;if(good&&reward.includes('+Alliance'))showFull(`${portrait('TV CONTESTANT','NEW CASTLE FIVE ALLY',H.overlays.CASTLE_FIVE,portraitUrl,'DYNAMIC TV CONTESTANT PORTRAIT')}<div class="eyebrow">MASKED FAITHFUL RESULT</div><h2>WELCOME TO THE CASTLE 5 ALLIANCE</h2><p class="small">New alliance member added. Bonus earned: <strong>${amount} pts</strong>.</p><button class="btn primary" data-next style="width:100%;margin-top:14px">NEXT ENCOUNTER</button>`);else showFull(`<div class="eyebrow">MASKED FAITHFUL RESULT</div><h2>${good?'YOU GOT IT RIGHT':'NOT THIS TIME'}</h2><p class="small">${good?`Reward: <strong>${reward}</strong><br>Amount earned: <strong>${amount} pts</strong>.`:'Wrong prediction — wager lost. No additional penalty.'}</p><button class="btn primary" data-next style="width:100%;margin-top:14px">NEXT ENCOUNTER</button>`)};
let spin=$('spin');if(spin)spin.onclick=()=>{if(s.spinBusy||s.wheel.length>=3)return;s.spinBusy=true;let stopType=pick(['FAST STOP','SLOW STOP','RANDOM STOP']),dur=stopType==='FAST STOP'?1.4:stopType==='SLOW STOP'?4.1:(1.8+Math.random()*2.2);s.spinDuration=dur;s.spinEase=stopType==='FAST STOP'?'cubic-bezier(.2,.7,.2,1)':stopType==='SLOW STOP'?'cubic-bezier(.08,.65,.08,1)':'cubic-bezier(.13,.72,.11,1)';let idx=Math.floor(Math.random()*wheelItems.length),symbol=wheelItems[idx];s.rot+=1080+Math.floor(Math.random()*720)+idx*45;render();later(()=>{s.wheel.push(symbol);s.spinBusy=false;render();if(s.wheel.length===3){later(()=>{let counts={};s.wheel.forEach(x=>counts[x]=(counts[x]||0)+1);let match=Object.keys(counts).find(x=>counts[x]>=2);s.murderMode=match||'STANDARD MURDER';render();let box=$('murderBenefit');if(box)box.innerHTML=`<div class="status">POP: LET'S MURDER SOMEONE...</div><div class="benefit"><strong>${s.murderMode}</strong><div class="small">Select this murder benefit to continue.</div><button class="btn primary" id="chooseBenefit" style="width:100%;margin-top:7px">USE ${s.murderMode}</button></div>`;let cb=$('chooseBenefit');if(cb)cb.onclick=()=>{s.murderMode='targets';render()}},5000)}},dur*1000)};
stage.querySelectorAll('[data-victim]').forEach(b=>b.onclick=()=>{s.murderVictim=b.dataset.victim;render()});let cm=$('confirmMurder');if(cm)cm.onclick=()=>showFull(`<img class="result-prop" src="${H.props.MURDERER_CARD}" alt="Murderer card"><div class="eyebrow">SECRET MURDER SEALED</div><h2>YOU MURDERER — YOU KILLED IT!</h2><p class="small"><strong>${s.murderVictim}</strong> was selected. Your identity stays secret until the end of the game.</p><button class="btn primary" data-next style="width:100%;margin-top:14px">NEXT ENCOUNTER</button>`,'murder');
stage.querySelectorAll('[data-fate]').forEach(b=>b.onclick=()=>{let i=+b.dataset.fate;if(s.fate.includes(i)||s.murders>=3||s.safes>=3)return;s.fate.push(i);let v=s.fateDeck[i];if(v==='SAFE')s.safes++;else{s.murders++;s.lastWeapon=v}render();if(s.safes>=3)later(()=>showFull(`<img class="result-prop" src="${H.props.FATE_SAFE}" alt="Safe Fate card"><div class="eyebrow">FATE RESULT</div><h2>SAFE</h2><p class="small">You survived Fate. All unselected cards have been revealed and faded.</p><p class="status">Lives remaining: ${s.lives}</p><button class="btn primary" data-next style="width:100%;margin-top:14px">NEXT ENCOUNTER</button>`),1200);if(s.murders>=3){s.lives=Math.max(0,s.lives-1);later(()=>showFull(`<img class="result-prop" src="${H.props.FATE_MURDERED}" alt="Murder Fate card"><div class="eyebrow">FATE RESULT</div><h2>DEATH BY ${s.lastWeapon}</h2><p class="small">An active TV Traitor carried out the murder: <strong>${pick(['Traitor A','Traitor B','Traitor C'])}</strong>.</p><p class="status">Lives remaining: ${s.lives}</p><button class="btn primary" data-next style="width:100%;margin-top:14px">NEXT ENCOUNTER</button>`,'murder'),900)}})

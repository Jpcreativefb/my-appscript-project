<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Awards App</title>

<!-- =========================
     PWA / MOBILE APP SUPPORT
========================= -->

<link
  rel="manifest"
  href="./manifest.webmanifest"
>

<meta
  name="theme-color"
  content="#111827"
>

<meta
  name="application-name"
  content="Awards App"
>

<meta
  name="mobile-web-app-capable"
  content="yes"
>

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<meta
  name="apple-mobile-web-app-title"
  content="Awards App"
>

<meta
  name="apple-mobile-web-app-status-bar-style"
  content="black-translucent"
>

<link
  rel="apple-touch-icon"
  href="./icons/icon-192.png"
>

<link
  rel="icon"
  type="image/png"
  sizes="192x192"
  href="./icons/icon-192.png"
>

<link
  rel="icon"
  type="image/png"
  sizes="512x512"
  href="./icons/icon-512.png"
>

<link rel="stylesheet" href="./css/styles.css">
<link rel="stylesheet" href="./css/components.css">
<link rel="stylesheet" href="./css/pages.css">
<link rel="stylesheet" href="./css/picks.css">
<link rel="stylesheet" href="./css/betting.css">
<link rel="stylesheet" href="./css/profile.css">
<link rel="stylesheet" href="./css/archive-history.css">
<link rel="stylesheet" href="./css/frontend-leaderboard-profile.css">
<link rel="stylesheet" href="./css/league-admin.css">

</head>

<body>

<!-- HEADER -->
<header class="app-header">

  <div class="header-left">

    <div class="app-title">
      🏆 PATTC Predictions
    </div>

  </div>

  <div
    id="headerUser"
    class="header-user"
  >
    User
  </div>

</header>

<!-- MAIN -->
<main id="app"></main>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">

  <button
    data-page="dashboard"
    onclick="navigate('dashboard')"
  >
    Home
  </button>

  <button
    onclick="window.location.href='./sports.html'"
  >
    Sports
  </button>

  <button
    id="adminNavButton"
    data-page="admin"
    onclick="navigate('admin')"
    style="display:none;"
  >
    Admin
  </button>

  <button data-page="profile"
    onclick="navigate('profile')">
    Profile
  </button>

  <button onclick="logout()">
    Logout
  </button>

</nav>

<!-- LOADER -->
<div id="loader" class="loader hidden">
  <div class="spinner"></div>
</div>

<script src="./js/config.js"></script>
<script src="./js/utils.js"></script>
<script src="./js/api.js"></script>
<script src="./js/state.js"></script>

<script src="./js/pages/dashboard.js"></script>
<script src="./js/pages/picks.js"></script>
<script src="./js/pages/betting.js"></script>
<script src="./js/pages/leaderboard.js"></script>
<script src="./js/pages/seasonHub.js"></script>
<script src="./js/pages/leagues.js"></script>
<script src="./js/pages/admin.js"></script>
<script src="./js/pages/adminGames.js"></script>
<script src="./js/pages/adminGameSetup.js"></script>
<script src="./js/pages/profile.js"></script>
<script src="./js/pages/archiveHistory.js"></script>

<script src="./js/app.js"></script>

<!-- =========================
     PWA SERVICE WORKER
========================= -->
<script src="./js/pwa.js"></script>

</body>
</html>

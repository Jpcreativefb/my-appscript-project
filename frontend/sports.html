<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <title>Sports Scores</title>

  <!-- =========================
       PWA / MOBILE APP SUPPORT
  ========================= -->

  <link
    rel="manifest"
    href="./manifest.webmanifest"
  >

  <meta
    name="theme-color"
    content="#111827"
  >

  <meta
    name="application-name"
    content="Awards App"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Awards App"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <link
    rel="apple-touch-icon"
    href="./icons/icon-192.png"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="./icons/icon-192.png"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="512x512"
    href="./icons/icon-512.png"
  >

  <link
    rel="stylesheet"
    href="./css/sports.css?v=310-reality-tv-historical-results"
  />

  <script defer src="./js/config.js"></script>
  <script defer src="./assets/images/image-manifest.js?v=310-reality-tv-historical-results"></script>
  <script defer src="./js/imageEngine.js?v=310-reality-tv-historical-results"></script>
  <script defer src="./js/sports.js?v=310-reality-tv-historical-results"></script>
  <script defer src="./js/pwa.js"></script>

</head>

<body>

  <header class="app-header">

    <div>
      <h1>Sports Scores</h1>
      <p>Live scores, finals, snapshots, and enabled leagues.</p>
    </div>

    <nav class="top-nav">
      <a href="./app.html">PATTC Predicts</a>
      <a href="./sports.html" class="active">Sports</a>
    </nav>

  </header>

  <main class="page">

    <section class="toolbar">

      <div class="filters-card">

        <label class="filter-control">
          <span>League</span>

          <select id="leagueSelect">
            <option value="">All Leagues</option>
          </select>
        </label>

        <label class="filter-control">
          <span>Status</span>

          <select id="statusSelect">
            <option value="all">All Games</option>
            <option value="live">Live Only</option>
            <option value="final">Final Only</option>
            <option value="not-final">Not Final</option>
          </select>
        </label>

        <label class="filter-control">
          <span>Date From</span>

          <input
            id="dateFromInput"
            type="date"
          >
        </label>

        <label class="filter-control">
          <span>Date To</span>

          <input
            id="dateToInput"
            type="date"
          >
        </label>

        <label class="filter-control">
          <span>Team</span>

          <input
            id="teamInput"
            type="search"
            placeholder="Cubs, White Sox, CHC, CWS..."
          >
        </label>

        <div class="filter-actions">

          <button
            id="btnToday"
            class="secondary-btn"
          >
            Today
          </button>

          <button
            id="btnClearFilters"
            class="secondary-btn"
          >
            Clear
          </button>

          <button
            id="btnReload"
            class="primary-btn"
          >
            Reload
          </button>

          <button
            id="btnRefreshScoreWindow"
            class="secondary-btn"
            type="button"
          >
            Refresh Score Window
          </button>

        </div>

      </div>

    </section>

    <section
      id="sportsAdvancedBuilderSection"
      class="sports-advanced-builder-section hidden"
      aria-live="polite"
    ></section>

    <section id="statusBox" class="status-box">
      Loading sports scores...
    </section>

    <section id="errorBox"></section>

    <section
      id="sportsBulkWagerBar"
      class="sports-bulk-wager-bar hidden"
    >

      <label class="sports-bulk-select-all">
        <input
          type="checkbox"
          id="sportsBulkSelectAll"
        >
        <span>Select all visible games</span>
      </label>

      <div
        id="sportsBulkSelectedCount"
        class="sports-bulk-selected-count"
      >
        0 games selected
      </div>

      <button
        id="sportsBulkCreateWagersBtn"
        class="primary-btn sports-bulk-create-btn"
        type="button"
      >
        Create Wagers for Selected Games
      </button>

    </section>

    <section id="scoresGrid" class="scores-grid"></section>

    <section id="snapshotPanel" class="snapshot-panel hidden">

      <div class="snapshot-header">

        <h2 id="snapshotTitle">Snapshots</h2>

        <button
          id="btnCloseSnapshots"
          class="secondary-btn"
        >
          Close
        </button>

      </div>

      <div id="snapshotContent"></div>

    </section>

  </main>

</body>
</html>

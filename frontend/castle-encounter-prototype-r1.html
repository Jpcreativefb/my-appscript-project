<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Castle Encounter Prototype R1</title>
<style>
:root{--gold:#d8b35a;--ink:#080808;--panel:rgba(10,10,10,.72);--line:rgba(216,179,90,.52);--cream:#f4ead1;--muted:#bcb6aa;--danger:#991c1c}
*{box-sizing:border-box}body{margin:0;background:#050505;color:var(--cream);font-family:Georgia,'Times New Roman',serif}button{font:inherit}.shell{min-height:100vh;background:linear-gradient(rgba(0,0,0,.38),rgba(0,0,0,.82)),url('./assets/castle/rooms/strategy-chamber-modern.webp') center/cover fixed;padding:16px 12px 28px}.phone{max-width:430px;margin:0 auto}.eyebrow{font:700 11px/1.2 Arial,sans-serif;letter-spacing:.18em;color:var(--gold);text-transform:uppercase}.title{font-size:30px;line-height:1;margin:6px 0 4px}.sub{font:14px/1.45 Arial,sans-serif;color:#ddd;margin:0 0 14px}.tabs{display:flex;gap:6px;overflow:auto;padding:2px 0 10px}.tabs button{white-space:nowrap;border:1px solid #6e5b2d;background:#111;color:#ddd;padding:8px 10px;border-radius:2px}.tabs button.active{background:var(--gold);color:#15110a}.card{border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(4px);padding:14px;margin:0 0 12px;border-radius:2px}.big{font-size:24px;margin:0 0 8px}.host{display:flex;gap:12px;align-items:center}.portrait{width:92px;aspect-ratio:3/4;border:2px solid var(--gold);background:linear-gradient(145deg,#191919,#000);display:grid;place-items:center;font-size:40px;flex:0 0 auto}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.btn{min-height:46px;border:1px solid var(--gold);background:#131313;color:var(--cream);padding:10px;border-radius:2px}.btn.primary{background:var(--gold);color:#181208;font-weight:700}.btn.danger{background:#471010;border-color:#b43b3b}.btn.selected{background:var(--gold);color:#181208;font-weight:800;box-shadow:inset 0 0 0 2px #f4e2a4}.btn:disabled{opacity:.48}.selection-summary{font:700 12px/1.45 Arial,sans-serif;color:#f4e2a4;margin-top:8px}.status{font:700 13px/1.4 Arial,sans-serif;letter-spacing:.04em;margin-top:10px;color:#eee}.grid6{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tile{aspect-ratio:1/1.1;border:1px solid #79642f;background:linear-gradient(145deg,#1b1710,#090806);color:var(--cream);padding:6px;display:grid;place-items:center;text-align:center;border-radius:2px;min-width:0}.tile.revealed{background:#241f13}.tile.matched{outline:2px solid var(--gold)}.masked-stage{position:relative;height:220px;border:1px solid var(--line);overflow:hidden;background:radial-gradient(circle at 50% 35%,#35312c 0,#0b0b0b 45%,#030303 100%)}.masked-row{position:absolute;inset:30px 12px 0;display:flex;justify-content:center;gap:6px;align-items:end}.mask{width:56px;height:110px;background:linear-gradient(#202020,#090909);clip-path:polygon(20% 0,80% 0,100% 28%,88% 100%,12% 100%,0 28%);position:relative}.mask:before{content:'';position:absolute;left:50%;top:10px;transform:translateX(-50%);width:36px;height:31px;border-radius:50% 50% 45% 45%;background:#b9b5aa;box-shadow:inset 0 -7px 0 #777}.mask.center{transform:scale(1.15);z-index:2}.envelope{position:absolute;width:72px;height:46px;left:50%;bottom:22px;transform:translateX(-50%) rotate(-4deg);background:#e5d6b5;border:1px solid #8b7445;color:#3b2b14;display:grid;place-items:center;font:700 10px Arial,sans-serif;letter-spacing:.08em}.wheel-wrap{display:grid;place-items:center;margin:10px 0}.pointer{width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:22px solid var(--gold);margin-bottom:-7px;z-index:2}.wheel{width:250px;height:250px;border-radius:50%;border:7px solid #443715;background:conic-gradient(#6b1919 0 30deg,#171717 30deg 60deg,#5d4a1b 60deg 90deg,#242424 90deg 120deg,#6b1919 120deg 150deg,#171717 150deg 180deg,#5d4a1b 180deg 210deg,#242424 210deg 240deg,#6b1919 240deg 270deg,#171717 270deg 300deg,#5d4a1b 300deg 330deg,#242424 330deg 360deg);position:relative;transition:transform 2.2s cubic-bezier(.16,.74,.12,1)}.wheel:after{content:'MURDER';position:absolute;inset:92px;background:#090909;border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;font:700 12px Arial,sans-serif;letter-spacing:.14em}.spins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.spin-slot{border:1px solid #665426;background:#111;min-height:62px;padding:7px;text-align:center;font:12px Arial,sans-serif}.fate{transition:background .35s ease}.fate.r1{background:linear-gradient(rgba(70,0,0,.22),rgba(0,0,0,.84)),url('./assets/castle/rooms/strategy-chamber-modern.webp') center/cover}.fate.r2{background:linear-gradient(rgba(115,0,0,.38),rgba(0,0,0,.8)),url('./assets/castle/rooms/strategy-chamber-modern.webp') center/cover}.fate.r3{background:linear-gradient(rgba(165,0,0,.55),rgba(10,0,0,.82)),url('./assets/castle/rooms/strategy-chamber-modern.webp') center/cover}.fate-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.fate-card{aspect-ratio:1/1.25;border:1px solid #795f2b;background:#16110b;color:#ead9b2}.full-result{position:fixed;inset:0;z-index:20;background:radial-gradient(circle,#8c0000 0,#260000 44%,#020000 100%);display:none;place-items:center;text-align:center}.full-result.show{display:grid}.murdered{font:900 clamp(56px,18vw,104px)/.9 Arial,sans-serif;letter-spacing:-.05em;color:#fff;text-shadow:0 4px 30px #000}.small{font:12px/1.35 Arial,sans-serif;color:var(--muted)}.hidden{display:none!important}
</style>
</head>
<body>
<div class="shell" id="shell"><div class="phone"><div class="eyebrow">PATTC CASTLE · INTERACTION PROOF</div><h1 class="title">Encounter Lab</h1><p class="sub">Director prototype only. No production writes, no scoring changes, no backend changes.</p><div class="tabs" id="tabs"></div><main id="stage"></main></div></div>
<div class="full-result" id="fullResult"><div><div class="murdered">MURDERED!</div><div class="small" style="margin-top:18px">Fate has spoken.</div><button class="btn" id="closeResult" style="margin-top:24px">Return to Fate proof</button></div></div>
<script>
(function(){
const views=['Regular Host','Masked Host','Masked Faithful','Murderer Wheel','Traitor Fate'];let current=0;let state={};
const tabs=document.getElementById('tabs'),stage=document.getElementById('stage'),shell=document.getElementById('shell');
function reset(){state={hostChoice:'',hostGuess:'',maskedHost:[],faithful:null,faithfulChoice:'',wheelSpins:[],wheelRot:0,fate:[],murders:0,safes:0};shell.className='shell';render();}
function tabBar(){tabs.innerHTML=views.map((v,i)=>`<button class="${i===current?'active':''}" data-i="${i}">${v}</button>`).join('');tabs.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{current=+b.dataset.i;reset()}));}
function regularHost(){return `<section class="card"><div class="eyebrow">REGULAR ENCOUNTER</div><h2 class="big">The Host</h2><div class="host"><div class="portrait">H</div><div><strong>Read the Host.</strong><p class="small">Choose your own move and predict whether the Host will Cooperate or Betray.</p></div></div><div class="status">YOUR MOVE</div><div class="choices"><button class="btn ${state.hostChoice==='COOPERATE'?'selected':''}" aria-pressed="${state.hostChoice==='COOPERATE'}" data-host-own="COOPERATE">COOPERATE</button><button class="btn ${state.hostChoice==='BETRAY'?'selected':''}" aria-pressed="${state.hostChoice==='BETRAY'}" data-host-own="BETRAY">BETRAY</button></div><div class="selection-summary">Selected: ${state.hostChoice||'—'}</div><div class="status">HOST PREDICTION</div><div class="choices"><button class="btn ${state.hostGuess==='COOPERATE'?'selected':''}" aria-pressed="${state.hostGuess==='COOPERATE'}" data-host-guess="COOPERATE">HOST COOPERATES</button><button class="btn ${state.hostGuess==='BETRAY'?'selected':''}" aria-pressed="${state.hostGuess==='BETRAY'}" data-host-guess="BETRAY">HOST BETRAYS</button></div><div class="selection-summary">Prediction: ${state.hostGuess||'—'}</div><button class="btn primary" id="hostLock" style="width:100%;margin-top:10px" ${state.hostChoice&&state.hostGuess?'':'disabled'}>SEAL DECISION</button><div id="hostOut" class="status"></div></section>`}
function maskedIntro(){return `<section class="card"><div class="masked-stage"><div class="masked-row">${'<div class="mask"></div>'.repeat(2)}<div class="mask center"></div>${'<div class="mask"></div>'.repeat(2)}</div><div class="envelope">TAKE ME</div></div><div class="eyebrow" style="margin-top:12px">THE MASKED HALL</div><h2 class="big">An offer has been made.</h2><p class="small">The center figure holds out the wager envelope.</p></section>`}
function maskedHost(){let vals=['LIFE / SHIELD','BIG BONUS','BANISH REDUCTION','LIFE / SHIELD','BIG BONUS','BANISH REDUCTION'];return maskedIntro()+`<section class="card"><div class="eyebrow">MASKED OUTCOME · HOST</div><h2 class="big">Find a matching pair</h2><p class="small">Six sealed rewards. You may reveal three cards. Match two of the same to claim that Host reward. Fail to match and your wager is returned.</p><div class="grid6">${vals.map((v,i)=>`<button class="tile ${state.maskedHost.includes(i)?'revealed':''}" data-mh="${i}" ${state.maskedHost.length>=3&&!state.maskedHost.includes(i)?'disabled':''}>${state.maskedHost.includes(i)?v:'HOST'}</button>`).join('')}</div><div id="mhOut" class="status"></div></section>`}
function maskedFaithful(){let cards=['Alliance · 3×','Alliance · 2×','Alliance · 2×','Alliance · Return','Faithful · +Alliance','Faithful · +Alliance'];return maskedIntro()+`<section class="card"><div class="eyebrow">MASKED OUTCOME · FAITHFUL</div><h2 class="big">Choose a blind contestant</h2><p class="small">Most cards are Castle 5 allies. Others are Faithfuls outside your Alliance and can earn an additional Alliance member.</p><div class="grid6">${cards.map((v,i)=>`<button class="tile ${state.faithful===i?'revealed':''}" data-faithful="${i}">${state.faithful===i?v:'CONTESTANT'}</button>`).join('')}</div>${state.faithful!==null?`<div class="status">PLAY COOPERATE / BETRAY</div><div class="choices"><button class="btn" data-fc="COOPERATE">COOPERATE</button><button class="btn" data-fc="BETRAY">BETRAY</button></div><button class="btn primary" id="faithfulLock" style="width:100%;margin-top:10px" ${state.faithfulChoice?'':'disabled'}>LOCK PREDICTION</button><div id="faithfulOut" class="status"></div>`:''}</section>`}
const wheelSymbols=['DAGGER','MURDER KEY','MURDERER CARD','POISON','ROPE','WRENCH'];
function murdererWheel(){return `<section class="card"><div class="eyebrow">MASKED OUTCOME · MURDERER</div><h2 class="big">The Murder Wheel</h2><p class="small">Three spins. Match any symbol twice to strengthen the murder. No match still grants the standard secret murder.</p><div class="wheel-wrap"><div class="pointer"></div><div class="wheel" id="wheel" style="transform:rotate(${state.wheelRot}deg)"></div></div><button class="btn primary" id="spin" style="width:100%" ${state.wheelSpins.length>=3?'disabled':''}>${state.wheelSpins.length>=3?'SPINS COMPLETE':'SPIN '+(state.wheelSpins.length+1)}</button><div class="spins">${[0,1,2].map(i=>`<div class="spin-slot">${state.wheelSpins[i]||'—'}</div>`).join('')}</div><div id="wheelOut" class="status"></div></section>`}
function fate(){let icons=['DAGGER','SAFE','POISON','SAFE','ROPE','SAFE','WRENCH','SAFE','SAFE'];return `<section class="card"><div class="eyebrow">TRAITOR · FATE</div><h2 class="big">Choose an envelope</h2><p class="small">Reveal cards one at a time. Murder cards make the room increasingly red. First to 3 Murder or 3 Safe ends Fate in this proof.</p><div class="fate-grid">${icons.map((v,i)=>`<button class="fate-card" data-fate="${i}" ${state.fate.includes(i)?'disabled':''}>${state.fate.includes(i)?v:'SEALED'}</button>`).join('')}</div><div class="status">MURDER ${state.murders}/3 · SAFE ${state.safes}/3</div></section>`}
function render(){tabBar();stage.innerHTML=current===0?regularHost():current===1?maskedHost():current===2?maskedFaithful():current===3?murdererWheel():fate();wire()}
function wire(){stage.querySelectorAll('[data-host-own]').forEach(b=>b.addEventListener('click',()=>{state.hostChoice=b.dataset.hostOwn;render()}));stage.querySelectorAll('[data-host-guess]').forEach(b=>b.addEventListener('click',()=>{state.hostGuess=b.dataset.hostGuess;render()}));let hl=document.getElementById('hostLock');if(hl)hl.addEventListener('click',()=>{document.getElementById('hostOut').textContent='Decision sealed. In the live game, the backend Host answer and normal Castle settlement stay authoritative.'});stage.querySelectorAll('[data-mh]').forEach(b=>b.onclick=()=>{let i=+b.dataset.mh;if(!state.maskedHost.includes(i)&&state.maskedHost.length<3)state.maskedHost.push(i);render();let out=document.getElementById('mhOut');let vals=['LIFE / SHIELD','BIG BONUS','BANISH REDUCTION','LIFE / SHIELD','BIG BONUS','BANISH REDUCTION'];let chosen=state.maskedHost.map(x=>vals[x]);let match=chosen.find((x,idx)=>chosen.indexOf(x)!==idx);if(match)out.textContent='MATCH: '+match+' — reward earned.';else if(state.maskedHost.length===3)out.textContent='No match — wager returned.'});stage.querySelectorAll('[data-faithful]').forEach(b=>b.onclick=()=>{state.faithful=+b.dataset.faithful;render()});stage.querySelectorAll('[data-fc]').forEach(b=>b.onclick=()=>{state.faithfulChoice=b.dataset.fc;render()});let fl=document.getElementById('faithfulLock');if(fl)fl.onclick=()=>{let good=Math.random()<.8;document.getElementById('faithfulOut').textContent=good?'Correct prediction — selected Faithful reward pays immediately.':'Wrong prediction — wager lost, no additional penalty.'};let sp=document.getElementById('spin');if(sp)sp.onclick=()=>{let symbol=wheelSymbols[Math.floor(Math.random()*wheelSymbols.length)];state.wheelSpins.push(symbol);state.wheelRot+=720+Math.floor(Math.random()*300);render();let counts={};state.wheelSpins.forEach(x=>counts[x]=(counts[x]||0)+1);let match=Object.keys(counts).find(x=>counts[x]>=2),out=document.getElementById('wheelOut');if(match)out.textContent='MATCH: '+match+' — upgraded secret murder unlocked.';else if(state.wheelSpins.length===3)out.textContent='No match — standard secret murder still unlocked.'};stage.querySelectorAll('[data-fate]').forEach(b=>b.onclick=()=>{let i=+b.dataset.fate;if(state.fate.includes(i)||state.murders>=3||state.safes>=3)return;state.fate.push(i);let vals=['DAGGER','SAFE','POISON','SAFE','ROPE','SAFE','WRENCH','SAFE','SAFE'];if(vals[i]==='SAFE')state.safes++;else state.murders++;shell.className='shell fate r'+Math.min(3,state.murders);render();if(state.murders>=3){setTimeout(()=>document.getElementById('fullResult').classList.add('show'),220)}})}
document.getElementById('closeResult').onclick=()=>{document.getElementById('fullResult').classList.remove('show');current=4;reset()};reset();
})();
</script>
</body></html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Sports Scores Test</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: #f9fafb;
    }

    header {
      padding: 20px;
      background: #020617;
      border-bottom: 1px solid #334155;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .sub {
      color: #94a3b8;
      font-size: 14px;
    }

    main {
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #1d4ed8;
    }

    button.secondary {
      background: #334155;
    }

    button.secondary:hover {
      background: #475569;
    }

    button.active {
      background: #16a34a;
    }

    .status {
      margin-bottom: 16px;
      color: #cbd5e1;
      font-size: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 16px;
    }

    .league {
      color: #93c5fd;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .teams {
      display: grid;
      gap: 8px;
      margin-bottom: 12px;
    }

    .team-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 18px;
    }

    .team-name {
      font-weight: bold;
    }

    .score {
      font-size: 22px;
      font-weight: bold;
    }

    .meta {
      border-top: 1px solid #334155;
      padding-top: 10px;
      color: #cbd5e1;
      font-size: 13px;
      display: grid;
      gap: 4px;
    }

    .final {
      color: #22c55e;
      font-weight: bold;
    }

    .live {
      color: #facc15;
      font-weight: bold;
    }

    .scheduled {
      color: #93c5fd;
      font-weight: bold;
    }

    .empty {
      background: #1e293b;
      border: 1px dashed #475569;
      border-radius: 12px;
      padding: 24px;
      color: #94a3b8;
      text-align: center;
    }

    .error {
      background: #7f1d1d;
      border: 1px solid #ef4444;
      color: #fee2e2;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
  </style>
</head>

<body>
  <header>
    <h1>Sports Scores Test</h1>
    <div class="sub">
      Testing Sports Scores Engine API → Google Sheet → Frontend
    </div>
  </header>

  <main>
    <div class="controls" id="leagueButtons">
      <button onclick="loadScores()">All Scores</button>
    </div>

    <div class="controls">
      <button class="secondary" onclick="loadScoresByState('in')">
        Live Only
      </button>

      <button class="secondary" onclick="loadScoresByCompleted('true')">
        Final Only
      </button>

      <button class="secondary" onclick="loadScoresByCompleted('false')">
        Not Final
      </button>

      <button class="secondary" onclick="loadLeagues()">
        Reload Leagues
      </button>
    </div>

    <div class="status" id="status">
      Loading...
    </div>

    <div id="errorBox"></div>

    <div class="grid" id="scoresGrid"></div>
  </main>

  <script>
    /****************************************
     IMPORTANT:
     Replace this with your Sports Scores
     Web App URL from Apps Script.
    ****************************************/

    const SPORTS_API_URL =
      "https://script.google.com/macros/s/AKfycbwVlgZa1FBvt99dpwr4PbrdBOs9IRcZ6BFlr-t6scTRNcVgQsJKpCWk1d8nxC681Sy0/exec";

    let currentScores = [];

    /****************************************
     JSONP HELPER
     This avoids Apps Script CORS issues.
    ****************************************/

    function jsonp(url) {
      return new Promise(function(resolve, reject) {
        const callbackName =
          "jsonpCallback_" +
          Date.now() +
          "_" +
          Math.floor(Math.random() * 100000);

        const separator =
          url.includes("?") ? "&" : "?";

        const script =
          document.createElement("script");

        const timeout =
          setTimeout(function() {
            cleanup();
            reject(new Error("JSONP request timed out"));
          }, 20000);

        window[callbackName] =
          function(data) {
            cleanup();
            resolve(data);
          };

        function cleanup() {
          clearTimeout(timeout);

          if (script.parentNode) {
            script.parentNode.removeChild(script);
          }

          delete window[callbackName];
        }

        script.onerror =
          function() {
            cleanup();
            reject(new Error("JSONP script failed to load"));
          };

        script.src =
          url +
          separator +
          "callback=" +
          encodeURIComponent(callbackName);

        document.body.appendChild(script);
      });
    }

    function apiUrl(action, params = {}) {
      const query =
        new URLSearchParams({
          action: action,
          ...params
        });

      return SPORTS_API_URL + "?" + query.toString();
    }

    /****************************************
     LOAD LEAGUES
    ****************************************/

    async function loadLeagues() {
      clearError();
      setStatus("Loading leagues...");

      try {
        const data =
          await jsonp(
            apiUrl("getSportsLeagues")
          );

        if (!data.success) {
          throw new Error(data.error || "Failed loading leagues");
        }

        renderLeagueButtons(data.leagues || []);

        setStatus(
          "Loaded " +
          data.count +
          " enabled leagues."
        );

        return data.leagues || [];

      } catch (err) {
        showError(err.message);
        setStatus("League load failed.");
        return [];
      }
    }

    function renderLeagueButtons(leagues) {
      const box =
        document.getElementById("leagueButtons");

      box.innerHTML =
        '<button onclick="loadScores()">All Scores</button>';

      leagues.forEach(function(item) {
        const btn =
          document.createElement("button");

        btn.className = "secondary";

        btn.textContent =
          item.sport + " / " + item.league;

        btn.onclick =
          function() {
            loadScores({
              sport: item.sport,
              league: item.league
            });
          };

        box.appendChild(btn);
      });
    }

    /****************************************
     LOAD SCORES
    ****************************************/

    async function loadScores(filters = {}) {
      clearError();
      setStatus("Loading scores...");

      try {
        const data =
          await jsonp(
            apiUrl("getSportsScores", filters)
          );

        if (!data.success) {
          throw new Error(data.error || "Failed loading scores");
        }

        currentScores = data.scores || [];

        renderScores(currentScores);

        setStatus(
          "Loaded " +
          data.count +
          " scores. Last checked: " +
          new Date(data.timestamp).toLocaleString()
        );

      } catch (err) {
        showError(err.message);
        setStatus("Score load failed.");
      }
    }

    function loadScoresByState(state) {
      loadScores({
        state: state
      });
    }

    function loadScoresByCompleted(completed) {
      loadScores({
        completed: completed
      });
    }

    /****************************************
     RENDER SCORES
    ****************************************/

    function renderScores(scores) {
      const grid =
        document.getElementById("scoresGrid");

      grid.innerHTML = "";

      if (!scores.length) {
        grid.innerHTML =
          '<div class="empty">No scores found for this filter.</div>';
        return;
      }

      scores.forEach(function(game) {
        const card =
          document.createElement("div");

        card.className = "card";

        card.innerHTML = `
          <div class="league">
            ${escapeHtml(game.Sport)} / ${escapeHtml(game.League)}
          </div>

          <div class="teams">
            <div class="team-row">
              <span class="team-name">${escapeHtml(game.AwayTeam || "Away")}</span>
              <span class="score">${formatScore(game.AwayScore)}</span>
            </div>

            <div class="team-row">
              <span class="team-name">${escapeHtml(game.HomeTeam || "Home")}</span>
              <span class="score">${formatScore(game.HomeScore)}</span>
            </div>
          </div>

          <div class="meta">
            <div>Status: ${formatStatus(game)}</div>
            <div>Period: ${escapeHtml(game.Period || "-")}</div>
            <div>Clock: ${escapeHtml(game.Clock || "-")}</div>
            <div>Winner: ${escapeHtml(game.Winner || "-")}</div>
            <div>GameId: ${escapeHtml(game.GameId || "-")}</div>
            <div>Updated: ${formatDate(game.LastUpdated)}</div>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    function formatScore(value) {
      if (
        value === "" ||
        value === null ||
        value === undefined
      ) {
        return "-";
      }

      return escapeHtml(String(value));
    }

    function formatStatus(game) {
      const state =
        String(game.State || "").toLowerCase();

      const completed =
        game.Completed === true ||
        String(game.Completed).toLowerCase() === "true";

      if (completed) {
        return '<span class="final">Final</span>';
      }

      if (state === "in") {
        return '<span class="live">Live</span>';
      }

      if (state === "pre") {
        return '<span class="scheduled">Scheduled</span>';
      }

      return escapeHtml(game.Status || state || "-");
    }

    function formatDate(value) {
      if (!value) {
        return "-";
      }

      const date =
        new Date(value);

      if (isNaN(date.getTime())) {
        return escapeHtml(String(value));
      }

      return date.toLocaleString();
    }

    /****************************************
     UI HELPERS
    ****************************************/

    function setStatus(message) {
      document.getElementById("status").textContent = message;
    }

    function showError(message) {
      document.getElementById("errorBox").innerHTML =
        '<div class="error">' +
        escapeHtml(message) +
        '</div>';
    }

    function clearError() {
      document.getElementById("errorBox").innerHTML = "";
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    /****************************************
     INITIAL LOAD
    ****************************************/

    async function init() {
      if (
        !SPORTS_API_URL ||
        SPORTS_API_URL.includes("PASTE_YOUR")
      ) {
        showError("Replace SPORTS_API_URL with your deployed Sports Scores Web App URL.");
        setStatus("Missing API URL.");
        return;
      }

      await loadLeagues();
      await loadScores();
    }

    init();
  </script>
</body>
</html>

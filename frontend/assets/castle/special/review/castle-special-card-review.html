<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Castle Special Card Pack R2 Review</title><script src="../../../../js/pages/castleDuelSpecialCardsR1.js"></script><style>html,body{margin:0;background:#0c0a0b;color:#eee}body{font-family:Arial,sans-serif}.review{width:min(100%,430px);margin:auto;padding:12px 10px 50px;background:linear-gradient(#171214,#090809);min-height:100vh}.head h1{font:600 27px/1 Georgia,serif;margin:5px 0}.head p,.note{font-size:11px;color:#bbae99;line-height:1.4}.sec{margin:18px 0}.sec>h2{font:700 10px/1 Arial;letter-spacing:.15em;text-transform:uppercase;color:#cbb581;margin:0 0 7px}.stack{display:grid;gap:9px}</style></head><body><main class="review csp2-root"><header class="head"><div class="csp2-kicker">PATTC Castle Duel · R2 Production Component Review</div><h1>Special Encounter Card Pack</h1><p>Presentation-only fixtures. No live Castle state, gameplay decisions, scoring, routing, or sealed-result authority.</p></header><div id="gallery"></div></main><script>
(function(){const C=window.CastleSpecialEncounterCardsR2;document.head.insertAdjacentHTML('beforeend','<style>'+C.style+'</style>');

const A={id:'a',name:'Avery',image:svg('#5a4437','REVIEW')},B={id:'b',name:'Jordan',image:svg('#3d4857','REVIEW')},D={id:'d',name:'Casey',image:svg('#584047','REVIEW')},P={id:'p',name:'Player One',image:svg('#394c40','PLAYER')},Q={id:'q',name:'Player Two',image:svg('#4b3a52','PLAYER')},R={id:'r',name:'Player Three',image:svg('#354b54','PLAYER')};
const sec=(t,h)=>`<section class="sec"><h2>${t}</h2><div class="stack">${h}</div></section>`;let out='';

out+=sec('Host Envelopes',C.hostEnvelopes());
out+=sec('Host Reveals',C.hostReveal({type:'GOLD',title:'GOLD',detail:'Castle Bank reward supplied by state.'})+C.hostReveal({type:'PROTECTION',title:'PROTECTION',detail:'Life Restored supplied by state.'})+C.hostReveal({type:'MERCY',title:'MERCY',detail:'Banish Pressure Cleared.'}));
